<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unit 2 Drill Room</title>
<meta name="description" content="Practice generator for OpenStax College Algebra 2e, sections 2.1, 2.2, 2.4 and 2.5.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --ground:#eaeff4; --paper:#ffffff; --paper-2:#f4f7fa;
  --ink:#0d1a26; --ink-2:#4d6070; --ink-3:#7b8d9c;
  --line:#d3dde6; --line-2:#e6edf3;
  --accent:#1b4fd1; --accent-ink:#ffffff; --accent-soft:#e2eafb; --accent-line:#b9cbf3;
  --ok:#0a7551; --ok-soft:#dbf1e7; --ok-line:#a5d9c4;
  --bad:#bd352b; --bad-soft:#fbe4e1; --bad-line:#f0b8b1;
  --warn:#9c5c06; --warn-soft:#fbeed8;
  --grid:rgba(27,79,209,.075); --grid-2:rgba(27,79,209,.16);
  --shadow:0 1px 2px rgba(13,26,38,.06), 0 6px 20px -8px rgba(13,26,38,.14);
  --radius:14px;
  --sans:"Familjen Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0a121a; --paper:#111d29; --paper-2:#16232f;
    --ink:#e8eff6; --ink-2:#9aadbe; --ink-3:#6f8496;
    --line:#25384b; --line-2:#1b2b3a;
    --accent:#7ba3ff; --accent-ink:#08131f; --accent-soft:#15294a; --accent-line:#2c4574;
    --ok:#42cd95; --ok-soft:#0f2e24; --ok-line:#1d5540;
    --bad:#ff7a6b; --bad-soft:#331a19; --bad-line:#5e2f2a;
    --warn:#e7ab52; --warn-soft:#2e2415;
    --grid:rgba(123,163,255,.09); --grid-2:rgba(123,163,255,.2);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0a121a; --paper:#111d29; --paper-2:#16232f;
  --ink:#e8eff6; --ink-2:#9aadbe; --ink-3:#6f8496;
  --line:#25384b; --line-2:#1b2b3a;
  --accent:#7ba3ff; --accent-ink:#08131f; --accent-soft:#15294a; --accent-line:#2c4574;
  --ok:#42cd95; --ok-soft:#0f2e24; --ok-line:#1d5540;
  --bad:#ff7a6b; --bad-soft:#331a19; --bad-line:#5e2f2a;
  --warn:#e7ab52; --warn-soft:#2e2415;
  --grid:rgba(123,163,255,.09); --grid-2:rgba(123,163,255,.2);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6);
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background-color:var(--ground);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{margin:0; font-weight:600; text-wrap:balance; letter-spacing:-.01em}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
input,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.wrap{max-width:820px; margin:0 auto; padding:0 16px 96px}

/* ---------- header ---------- */
header.top{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:820px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto; min-width:0}
.brand b{font-size:16px; font-weight:700; letter-spacing:-.02em; white-space:nowrap}
.brand span{font-family:var(--mono); font-size:11px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.iconbtn{
  background:var(--paper); border:1px solid var(--line); border-radius:9px;
  padding:6px 10px; font-size:12.5px; font-weight:500; color:var(--ink-2);
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.iconbtn:hover{border-color:var(--accent-line); color:var(--ink)}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent-line); color:var(--ink)}

/* ---------- cards ---------- */
.card{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; box-shadow:var(--shadow);
}
.stack{display:flex; flex-direction:column; gap:14px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.eyebrow{
  font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3);
}
.muted{color:var(--ink-2); font-size:14px}
.tiny{font-size:12.5px; color:var(--ink-3)}

/* ---------- buttons ---------- */
.btn{
  background:var(--paper); border:1px solid var(--line); border-radius:10px;
  padding:10px 15px; font-weight:500; font-size:14.5px; color:var(--ink);
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:border-color .12s, background .12s, transform .06s;
}
.btn:hover{border-color:var(--accent-line)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-2)}
.btn.ghost:hover{background:var(--paper-2); color:var(--ink)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn kbd{
  font-family:var(--mono); font-size:10.5px; border:1px solid currentColor; border-radius:4px;
  padding:0 4px; opacity:.5;
}

/* ---------- countdown / plan ---------- */
.hero{
  background:linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
  border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);
}
.cd{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.cd b{font-family:var(--mono); font-size:30px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.cd .cd-label{font-size:14px; color:var(--ink-2)}
input[type="datetime-local"]{
  background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:5px 8px;
  font-family:var(--mono); font-size:12.5px; color:var(--ink-2);
}
.steps-list{display:flex; flex-direction:column; gap:0; margin-top:14px; border-top:1px solid var(--line-2)}
.step{
  display:flex; align-items:center; gap:12px; padding:11px 2px;
  border-bottom:1px solid var(--line-2);
}
.step .num{
  flex:none; width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line);
  display:grid; place-items:center; font-family:var(--mono); font-size:11px; color:var(--ink-3);
}
.step.done .num{background:var(--ok-soft); border-color:var(--ok-line); color:var(--ok)}
.step .lbl{flex:1; min-width:0}
.step .lbl b{display:block; font-size:14.5px; font-weight:600}
.step .lbl span{display:block; font-size:12.5px; color:var(--ink-3)}
.step.done .lbl b{color:var(--ink-2)}

/* ---------- chips ---------- */
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{
  background:var(--paper); border:1px solid var(--line); border-radius:999px;
  padding:7px 13px; font-size:13.5px; font-weight:500; color:var(--ink-2);
}
.chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent-line); color:var(--ink); font-weight:600}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--paper)}
.seg button{background:transparent; border:0; padding:8px 13px; font-size:13.5px; color:var(--ink-2); border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft); color:var(--ink); font-weight:600}

/* ---------- readiness bars ---------- */
.bars{display:flex; flex-direction:column; gap:9px}
.barrow{display:grid; grid-template-columns:64px 1fr 44px; align-items:center; gap:10px}
.barrow .nm{font-family:var(--mono); font-size:12px; color:var(--ink-2)}
.barrow .pct{font-family:var(--mono); font-size:12px; color:var(--ink-2); text-align:right; font-variant-numeric:tabular-nums}
.track{height:8px; border-radius:99px; background:var(--line-2); overflow:hidden}
.fill{height:100%; border-radius:99px; background:var(--accent); transition:width .4s ease}
.fill.lo{background:var(--bad)} .fill.mid{background:var(--warn)} .fill.hi{background:var(--ok)}
.fill.none{background:var(--line)}

/* ---------- question ---------- */
.qhead{display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap}
.tag{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line);
  border-radius:5px; padding:2px 6px; font-weight:600;
}
:root[data-theme="dark"] .tag, :root:not([data-theme="light"]) .tag{color:var(--ink)}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .tag{color:var(--accent)} }
.qtext{font-family:var(--serif); font-size:20px; line-height:1.45; margin:8px 0 4px}
.qtext .fmt{display:block; font-family:var(--sans); font-size:12.5px; color:var(--ink-3); margin-top:8px}
.expr{font-family:var(--serif); white-space:nowrap}
.expr i{font-style:italic}
sup{font-size:.68em; vertical-align:super; line-height:0}
.fr{display:inline-block; vertical-align:middle; text-align:center; margin:0 .18em; font-size:.84em}
.fr span{display:block; padding:0 .2em; line-height:1.2}
.fr span:first-child{border-bottom:1.2px solid currentColor}
.rad{white-space:nowrap}
.rad .rc{border-top:1.1px solid currentColor; padding:0 .12em 0 .06em; margin-left:-.04em}

/* ---------- answering ---------- */
.ansbox{margin-top:16px}
.kpad{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px}
.kpad button{
  background:var(--paper-2); border:1px solid var(--line); border-radius:8px;
  min-width:36px; padding:6px 9px; font-family:var(--serif); font-size:16px; line-height:1;
}
.kpad button:hover{border-color:var(--accent-line)}
.kpad button.word{font-family:var(--sans); font-size:12.5px; font-weight:500; color:var(--ink-2)}
input.ans{
  width:100%; background:var(--paper); border:1.5px solid var(--line); border-radius:11px;
  padding:14px 15px; font-family:var(--serif); font-size:21px;
}
input.ans:focus{border-color:var(--accent); outline:none}
input.ans.ok{border-color:var(--ok); background:var(--ok-soft)}
input.ans.bad{border-color:var(--bad); background:var(--bad-soft)}
.choices{display:flex; flex-direction:column; gap:8px}
.choice{
  display:flex; align-items:flex-start; gap:11px; text-align:left; width:100%;
  background:var(--paper); border:1.5px solid var(--line); border-radius:11px; padding:12px 14px;
  font-family:var(--serif); font-size:18px; transition:border-color .12s, background .12s;
}
.choice:hover:not(:disabled){border-color:var(--accent-line); background:var(--paper-2)}
.choice .k{
  flex:none; font-family:var(--mono); font-size:11px; font-weight:600; color:var(--ink-3);
  border:1px solid var(--line); border-radius:5px; padding:1px 5px; margin-top:3px;
}
.choice.ok{border-color:var(--ok); background:var(--ok-soft)}
.choice.ok .k{border-color:var(--ok-line); color:var(--ok)}
.choice.bad{border-color:var(--bad); background:var(--bad-soft)}
.choice.bad .k{border-color:var(--bad-line); color:var(--bad)}
.choice:disabled{cursor:default; opacity:1}

/* ---------- feedback ---------- */
.fb{border-radius:12px; padding:14px 15px; margin-top:14px; border:1px solid var(--line)}
.fb.good{background:var(--ok-soft); border-color:var(--ok-line)}
.fb.bad{background:var(--bad-soft); border-color:var(--bad-line)}
.fb.neutral{background:var(--paper-2)}
.fb .verdict{display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px}
.fb.good .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)}
.fb .nudge{font-size:14px; color:var(--ink-2); margin-top:5px}
.fb .correct{font-family:var(--serif); font-size:18px; margin-top:8px}
.hintbox{
  background:var(--warn-soft); border:1px solid var(--warn); border-left-width:3px;
  border-radius:9px; padding:11px 13px; margin-top:12px; font-size:14.5px;
}
.steps{margin-top:14px; border-top:1px solid var(--line-2); padding-top:12px}
.steps ol{margin:0; padding-left:0; list-style:none; counter-reset:s}
.steps li{
  counter-increment:s; position:relative; padding-left:30px; margin-bottom:11px;
  font-family:var(--serif); font-size:16.5px; line-height:1.5;
}
.steps li::before{
  content:counter(s); position:absolute; left:0; top:2px;
  font-family:var(--mono); font-size:10.5px; font-weight:600; color:var(--ink-3);
  border:1px solid var(--line); border-radius:5px; width:19px; height:19px;
  display:grid; place-items:center;
}
.rule{
  margin-top:12px; font-size:13.5px; color:var(--ink-2);
  background:var(--paper-2); border-radius:8px; padding:9px 11px;
  border-left:3px solid var(--accent);
}
.rule b{color:var(--ink)}

/* ---------- session header ---------- */
.sesshead{display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap}
.counter{font-family:var(--mono); font-size:12.5px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.timer{
  font-family:var(--mono); font-size:15px; font-weight:600; font-variant-numeric:tabular-nums;
  margin-left:auto; padding:3px 9px; border-radius:7px; background:var(--paper-2); border:1px solid var(--line);
}
.timer.warn{color:var(--warn); border-color:var(--warn); background:var(--warn-soft)}
.timer.crit{color:var(--bad); border-color:var(--bad-line); background:var(--bad-soft)}
.pbar{height:5px; border-radius:99px; background:var(--line-2); overflow:hidden; margin-bottom:16px}
.pbar>div{height:100%; background:var(--accent); transition:width .3s ease}
.dots{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:14px}
.dot{width:9px; height:9px; border-radius:50%; background:var(--line); flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.now{background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- plane ---------- */
.plane{display:block; margin:14px auto 4px; touch-action:manipulation; max-width:100%; height:auto}
.plane .ax{stroke:var(--ink-2); stroke-width:1.4}
.plane .gl{stroke:var(--grid-2); stroke-width:1}
.plane .tk{fill:var(--ink-3); font-family:var(--mono); font-size:9px}
.plane .ln{stroke:var(--accent); stroke-width:2.4; fill:none}
.plane .pt{fill:var(--accent); stroke:var(--paper); stroke-width:2}
.plane .pt.ghost{fill:none; stroke:var(--ink-3); stroke-dasharray:3 3; stroke-width:1.5}
.plane .lb{fill:var(--ink); font-family:var(--serif); font-size:12px; font-weight:600}
.plane.clickable{cursor:crosshair}

/* ---------- results ---------- */
.score{display:flex; align-items:center; gap:20px; flex-wrap:wrap}
.ring{flex:none}
.score .big{font-family:var(--mono); font-size:40px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums}
.rev{border-top:1px solid var(--line-2); padding-top:12px; margin-top:12px}
.rev summary{
  cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; padding:9px 0;
  font-family:var(--serif); font-size:16px;
}
.rev summary::-webkit-details-marker{display:none}
.rev summary .mk{flex:none; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:700; color:#fff}
.rev summary .mk.ok{background:var(--ok)} .rev summary .mk.bad{background:var(--bad)}
.rev .body{padding:4px 0 14px 30px; border-bottom:1px solid var(--line-2)}
table.tbl{width:100%; border-collapse:collapse; font-size:14px}
table.tbl th{text-align:left; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--line)}
table.tbl td{padding:8px; border-bottom:1px solid var(--line-2); vertical-align:middle}
table.tbl td.n{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.scroller{overflow-x:auto}

/* ---------- reference ---------- */
.refgrid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit, minmax(260px,1fr))}
.formula{font-family:var(--serif); font-size:18px; padding:7px 0; border-bottom:1px dashed var(--line-2)}
.formula:last-child{border-bottom:0}
.formula em{display:block; font-family:var(--sans); font-style:normal; font-size:12.5px; color:var(--ink-3); margin-top:2px}
.trap{display:flex; gap:9px; padding:7px 0; font-size:14px; border-bottom:1px dashed var(--line-2)}
.trap:last-child{border-bottom:0}
.trap .x{flex:none; color:var(--bad); font-weight:700}

/* ---------- print ---------- */
.paper-sheet{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow)}
.pq{margin-bottom:20px; font-family:var(--serif); font-size:17px; page-break-inside:avoid}
.pq .pn{font-family:var(--mono); font-size:12px; color:var(--ink-3); margin-right:8px}
.pq .work{border-bottom:1px solid var(--line-2); height:26px; margin-top:10px}
@media print{
  body{background:#fff !important; color:#000 !important}
  header.top, .noprint{display:none !important}
  .wrap{max-width:100%; padding:0}
  .paper-sheet{border:0; box-shadow:none; padding:0}
  .pagebreak{page-break-before:always}
  .pq{font-size:13pt}
}
@media (max-width:560px){
  .qtext{font-size:18px}
  .cd b{font-size:25px}
  .barrow{grid-template-columns:52px 1fr 40px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><b>Unit 2 Drill Room</b><span id="brandsub">College Algebra &middot; 2.1 &middot; 2.2 &middot; 2.4 &middot; 2.5</span></div>
    <button class="iconbtn" id="btn-home" type="button">Home</button>
    <button class="iconbtn" id="btn-theme" type="button" title="Switch light / dark">Theme</button>
  </div>
</header>
<main class="wrap" id="view"></main>

<script>
(function(){
"use strict";

/* ============================================================
   0. small utilities
   ============================================================ */
const $ = function(sel, root){ return (root||document).querySelector(sel); };
const el = function(tag, cls, html){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(html !== undefined && html !== null) n.innerHTML = html;
  return n;
};
const R = {
  i: function(a,b){ return a + Math.floor(Math.random()*(b-a+1)); },
  pick: function(a){ return a[R.i(0, a.length-1)]; },
  nz: function(a,b){ let v = 0; while(v === 0) v = R.i(a,b); return v; },
  sign: function(){ return Math.random() < 0.5 ? -1 : 1; },
  chance: function(p){ return Math.random() < p; },
  shuffle: function(a){
    const x = a.slice();
    for(let i = x.length-1; i > 0; i--){ const j = R.i(0,i); const t = x[i]; x[i] = x[j]; x[j] = t; }
    return x;
  },
  sample: function(a, n){ return R.shuffle(a).slice(0, n); }
};
function gcd(a,b){ a = Math.abs(a); b = Math.abs(b); while(b){ const t = b; b = a % b; a = t; } return a; }
function isSq(n){ return n >= 0 && Number.isInteger(Math.sqrt(n)); }
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

/* ============================================================
   1. math text helpers  (plain answer text uses  − √ ²  unicode)
   ============================================================ */
const MINUS = "−";        // proper minus sign
const X = '<i>x</i>', Y = '<i>y</i>';

function nn(n){ return n < 0 ? MINUS + Math.abs(n) : String(n); }          // display a number
function pm(n){ return (n < 0 ? " " + MINUS + " " : " + ") + Math.abs(n); } // " + 5" / " − 5"
function pmT(n, t){                                                        // " + 5x" / " − x"
  const a = Math.abs(n);
  return (n < 0 ? " " + MINUS + " " : " + ") + (a === 1 ? "" : a) + t;
}
function coefT(n, t){                                                      // "3x" / "−x" / "x"
  if(n === 1) return t;
  if(n === -1) return MINUS + t;
  return nn(n) + t;
}
/* fraction: html display */
function frH(a, b){
  if(b < 0){ a = -a; b = -b; }
  const g = gcd(a,b) || 1;
  a = a/g; b = b/g;
  if(b === 1) return nn(a);
  const s = a < 0 ? MINUS : "";
  return s + '<span class="fr"><span>' + Math.abs(a) + '</span><span>' + b + '</span></span>';
}
/* fraction: plain text */
function frT(a, b){
  if(b < 0){ a = -a; b = -b; }
  const g = gcd(a,b) || 1;
  a = a/g; b = b/g;
  if(b === 1) return nn(a);
  return (a < 0 ? MINUS : "") + Math.abs(a) + "/" + b;
}
function frVal(a,b){ return a/b; }
/* radical html:  k√n  */
function radH(inner){ return '<span class="rad">√<span class="rc">' + inner + '</span></span>'; }
/* simplify √n  ->  [outside, inside] */
function simpRad(n){
  let o = 1, inn = n;
  for(let k = Math.floor(Math.sqrt(n)); k >= 2; k--){
    if(inn % (k*k) === 0){ o *= k; inn /= (k*k); k = Math.floor(Math.sqrt(inn)) + 1; }
  }
  return [o, inn];
}
/* plain-text simplified radical, e.g. 2√13 ; returns "5" when perfect */
function radT(n, coef){
  if(coef === undefined) coef = 1;
  const p = simpRad(n), o = p[0]*coef, inn = p[1];
  if(inn === 1) return nn(o);
  if(o === 1) return "√" + inn;
  if(o === -1) return MINUS + "√" + inn;
  return nn(o) + "√" + inn;
}
function radHtml(n, coef){
  if(coef === undefined) coef = 1;
  const p = simpRad(n), o = p[0]*coef, inn = p[1];
  if(inn === 1) return nn(o);
  const c = (o === 1) ? "" : (o === -1 ? MINUS : nn(o));
  return c + radH(String(inn));
}
/* render plain answer text as pretty html */
function mt(s){
  if(s === undefined || s === null) return "";
  let t = String(s);
  t = t.replace(/\^(\d+)/g, "<sup>$1</sup>");
  t = t.replace(/\bsqrt\(([^)]*)\)/g, function(_, a){ return radH(a); });
  t = t.replace(/√(\d+)/g, function(_, a){ return radH(a); });
  t = t.replace(/(^|[^a-zA-Z])([xy])(?![a-zA-Z])/g, "$1<i>$2</i>");
  return t;
}
function ptT(x, y){ return "(" + nn(x) + ", " + nn(y) + ")"; }
function ptTf(a, b, c, d){ return "(" + frT(a,b) + ", " + frT(c,d) + ")"; }

/* complex number display from re/im (rationals allowed as numbers) */
function cxT(re, im){
  const rs = Math.abs(re - Math.round(re)) < 1e-9 ? String(Math.round(re)) : String(re);
  if(Math.abs(im) < 1e-12) return nn(Number(rs));
  const a = Math.abs(im);
  const ip = (a === 1 ? "" : (Math.abs(a - Math.round(a)) < 1e-9 ? String(Math.round(a)) : String(a))) + "i";
  if(Math.abs(re) < 1e-12) return (im < 0 ? MINUS : "") + ip;
  return nn(Number(rs)) + (im < 0 ? " " + MINUS + " " : " + ") + ip;
}

/* ============================================================
   2. complex arithmetic + expression evaluator
   Understands: numbers, i, x, y, + - * / ^, ( ), sqrt( ) / √,
   implicit multiplication (2i, 3√5, 2(x+1)), decimals, fractions.
   ============================================================ */
function C(re, im){ return { re: re, im: im || 0 }; }
function cAdd(a,b){ return C(a.re+b.re, a.im+b.im); }
function cSub(a,b){ return C(a.re-b.re, a.im-b.im); }
function cMul(a,b){ return C(a.re*b.re - a.im*b.im, a.re*b.im + a.im*b.re); }
function cDiv(a,b){
  const d = b.re*b.re + b.im*b.im;
  if(d === 0) throw new Error("div0");
  return C((a.re*b.re + a.im*b.im)/d, (a.im*b.re - a.re*b.im)/d);
}
function cSqrt(a){
  if(Math.abs(a.im) < 1e-14){
    if(a.re >= 0) return C(Math.sqrt(a.re), 0);
    return C(0, Math.sqrt(-a.re));
  }
  const r = Math.hypot(a.re, a.im), t = Math.atan2(a.im, a.re) / 2;
  const s = Math.sqrt(r);
  return C(s*Math.cos(t), s*Math.sin(t));
}
function cPow(a, b){
  if(Math.abs(b.im) < 1e-14 && Number.isInteger(b.re) && Math.abs(b.re) <= 200){
    let n = b.re, base = a, out = C(1,0);
    const neg = n < 0; n = Math.abs(n);
    for(let k = 0; k < n; k++) out = cMul(out, base);
    return neg ? cDiv(C(1,0), out) : out;
  }
  const r = Math.hypot(a.re, a.im);
  if(r === 0) return C(0,0);
  const t = Math.atan2(a.im, a.re);
  const lr = Math.log(r);
  const er = Math.exp(b.re*lr - b.im*t), ang = b.im*lr + b.re*t;
  return C(er*Math.cos(ang), er*Math.sin(ang));
}

const PRE_MAP = [
  [/[−–—‐‑]/g, "-"],
  [/[×⋅·]/g, "*"],
  [/[÷]/g, "/"],
  [/√/g, "sqrt"],
  [/²/g, "^2"], [/³/g, "^3"],
  [/[‘’“”]/g, ""],
  [/[\[\{]/g, "("], [/[\]\}]/g, ")"]
];
function pre(s){
  let t = String(s === undefined || s === null ? "" : s);
  for(let k = 0; k < PRE_MAP.length; k++) t = t.replace(PRE_MAP[k][0], PRE_MAP[k][1]);
  return t.trim();
}

function tokenize(src){
  const s = src.toLowerCase().replace(/\s+/g, "");
  const out = [];
  let k = 0;
  while(k < s.length){
    const ch = s[k];
    if(/[0-9.]/.test(ch)){
      let j = k;
      while(j < s.length && /[0-9.]/.test(s[j])) j++;
      const v = parseFloat(s.slice(k,j));
      if(!isFinite(v)) throw new Error("bad number");
      out.push({t:"num", v:v}); k = j;
    } else if(/[a-z]/.test(ch)){
      let j = k;
      while(j < s.length && /[a-z]/.test(s[j])) j++;
      let w = s.slice(k,j);
      // split run-together identifiers like "isqrt" or "xi"
      while(w.length){
        if(w.indexOf("sqrt") === 0){ out.push({t:"fn", v:"sqrt"}); w = w.slice(4); }
        else if(w.indexOf("root") === 0){ out.push({t:"fn", v:"sqrt"}); w = w.slice(4); }
        else if(w.indexOf("pi") === 0){ out.push({t:"const", v:"pi"}); w = w.slice(2); }
        else if("ixy".indexOf(w[0]) >= 0){ out.push({t:"var", v:w[0]}); w = w.slice(1); }
        else throw new Error("unknown ident " + w);
      }
      k = j;
    } else if("+-*/^(),".indexOf(ch) >= 0){
      out.push({t:"op", v:ch}); k++;
    } else {
      throw new Error("bad char " + ch);
    }
  }
  return out;
}

function evalExpr(src, env){
  const tk = tokenize(src);
  let p = 0;
  const peek = function(){ return tk[p]; };
  const eat = function(v){
    const t = tk[p];
    if(t && t.t === "op" && t.v === v){ p++; return true; }
    return false;
  };
  function startsPrimary(t){
    if(!t) return false;
    if(t.t === "num" || t.t === "var" || t.t === "fn" || t.t === "const") return true;
    return t.t === "op" && t.v === "(";
  }
  function parseE(){
    let v = parseT();
    for(;;){
      if(eat("+")) v = cAdd(v, parseT());
      else if(eat("-")) v = cSub(v, parseT());
      else return v;
    }
  }
  function parseT(){
    let v = parseF();
    for(;;){
      if(eat("*")) v = cMul(v, parseF());
      else if(eat("/")) v = cDiv(v, parseF());
      else if(startsPrimary(peek())) v = cMul(v, parseF());   // implicit multiplication
      else return v;
    }
  }
  function parseF(){
    const v = parseU();
    if(eat("^")) return cPow(v, parseF());
    return v;
  }
  function parseU(){
    if(eat("-")) return cSub(C(0,0), parseU());
    if(eat("+")) return parseU();
    return parseP();
  }
  function parseP(){
    const t = peek();
    if(!t) throw new Error("unexpected end");
    if(t.t === "num"){ p++; return C(t.v, 0); }
    if(t.t === "const"){ p++; return C(Math.PI, 0); }
    if(t.t === "var"){
      p++;
      if(t.v === "i") return C(0,1);
      if(env && Object.prototype.hasOwnProperty.call(env, t.v)) return C(env[t.v], 0);
      throw new Error("free variable " + t.v);
    }
    if(t.t === "fn"){
      p++;
      let arg;
      if(peek() && peek().t === "op" && peek().v === "("){ p++; arg = parseE(); if(!eat(")")) throw new Error("expected )"); }
      else arg = parseF();
      return cSqrt(arg);
    }
    if(t.t === "op" && t.v === "("){ p++; const v = parseE(); if(!eat(")")) throw new Error("expected )"); return v; }
    throw new Error("unexpected token " + t.v);
  }
  const val = parseE();
  if(p !== tk.length) throw new Error("trailing input");
  return val;
}

/* ============================================================
   3. answer grading
   kinds: num (set of values) | tuple | line | text | plot
   ============================================================ */
const TEXT_SYN = [
  ["nosolution", ["nosolution","nosolutions","norealsolution","norealsolutions","none","nonexistent","empty","emptyset","noreal","dne","doesnotexist","noanswer","0solutions","zerosolutions"]],
  ["allreal", ["allrealnumbers","allreals","allrealnumber","identity","infinitelymany","infinitelymanysolutions","infinite","infinitesolutions","everyrealnumber","allvaluesofx"]],
  ["undefined", ["undefined","undefinedslope","noslope","dne","doesnotexist"]],
  ["parallel", ["parallel","theyareparallel"]],
  ["perpendicular", ["perpendicular","theyareperpendicular","normal"]],
  ["neither", ["neither","neitherparallelnorperpendicular"]]
];
/* a phrase can belong to more than one synonym group ("DNE" means both
   "no solution" and "undefined"), so compare group membership, not one key */
function textGroups(s){
  const t = String(s === undefined || s === null ? "" : s)
    .toLowerCase()
    .replace(/[∅]|\{\s*\}/g, "nosolution")
    .replace(/[^a-z0-9]/g, "");
  const g = [t];
  for(let k = 0; k < TEXT_SYN.length; k++){
    if(TEXT_SYN[k][1].indexOf(t) >= 0) g.push(TEXT_SYN[k][0]);
  }
  return g;
}
function textKey(s){ return textGroups(s)[0]; }
function sameText(a, b){
  const ga = textGroups(a), gb = textGroups(b);
  if(!ga[0] && !gb[0]) return false;
  for(let k = 0; k < ga.length; k++){
    if(ga[k] && gb.indexOf(ga[k]) >= 0) return true;
  }
  return false;
}
function isPhrase(s, group){ return textGroups(s).indexOf(group) >= 0; }
/* split on top-level commas / "or" / "and" / ";" */
function splitTop(s){
  const parts = [];
  let depth = 0, cur = "";
  const t = s.replace(/\bor\b/gi, ",").replace(/\band\b/gi, ",").replace(/;/g, ",");
  for(let k = 0; k < t.length; k++){
    const c = t[k];
    if(c === "(") depth++;
    if(c === ")") depth--;
    if(c === "," && depth === 0){ parts.push(cur); cur = ""; }
    else cur += c;
  }
  parts.push(cur);
  return parts.map(function(z){ return z.trim(); }).filter(function(z){ return z.length > 0; });
}
/* expand ± into the two branches */
function expandPM(s){
  const idx = s.search(/[±]|\+\/-/);
  if(idx < 0) return [s];
  const m = s.match(/[±]|\+\/-/)[0];
  const a = s.replace(m, "+"), b = s.replace(m, "-");
  return expandPM(a).concat(expandPM(b));
}
/* strip a leading "x =" / "y =" / "x_1 =" */
function stripLead(s){
  return s.replace(/^\s*[a-z]\s*[_]?\d*\s*=\s*/i, "").trim();
}
/* parse a student's answer into a list of complex values, or null */
function parseValues(raw){
  let s = pre(raw);
  if(!s) return null;
  s = s.replace(/^\(([^()]*,[^()]*)\)$/, "$1");   // {2, -5} already mapped to ( )
  const parts = splitTop(s);
  if(!parts.length) return null;
  const vals = [];
  for(let k = 0; k < parts.length; k++){
    const branches = expandPM(stripLead(parts[k]));
    for(let j = 0; j < branches.length; j++){
      let v;
      try { v = evalExpr(branches[j], null); }
      catch(e){ return null; }
      if(!isFinite(v.re) || !isFinite(v.im)) return null;
      vals.push(v);
    }
  }
  return vals.length ? vals : null;
}
/* absolute tolerance: 1e-6 for exact answers, ~0.005 when a rounded decimal is acceptable */
function cEq(a, b, tol){
  const t = tol || 1e-6;
  return Math.abs(a.re - b.re) <= t && Math.abs(a.im - b.im) <= t;
}
/* unordered multiset comparison */
function setEq(got, want, tol){
  if(!got || !want) return false;
  if(got.length !== want.length) return false;
  const used = want.map(function(){ return false; });
  for(let k = 0; k < got.length; k++){
    let hit = -1;
    for(let j = 0; j < want.length; j++){
      if(!used[j] && cEq(got[k], want[j], tol)){ hit = j; break; }
    }
    if(hit < 0) return false;
    used[hit] = true;
  }
  return true;
}
/* line: reduce any linear equation to {vertical, m, b} */
function parseLine(raw){
  const s = pre(raw).toLowerCase().replace(/\s+/g, "");
  const eq = s.indexOf("=");
  if(eq < 0) return null;
  const L = s.slice(0, eq), Rr = s.slice(eq+1);
  if(!L || !Rr) return null;
  const f = function(x, y){
    const a = evalExpr(L, {x:x, y:y}), b = evalExpr(Rr, {x:x, y:y});
    const d = cSub(a, b);
    if(Math.abs(d.im) > 1e-9) throw new Error("complex line");
    return d.re;
  };
  let r, px, qy;
  try {
    r  = f(0,0);
    px = f(1,0) - r;
    qy = f(0,1) - r;
    const chk = f(2,3);
    if(Math.abs(chk - (2*px + 3*qy + r)) > 1e-6) return null;   // not linear
  } catch(e){ return null; }
  if(Math.abs(px) < 1e-12 && Math.abs(qy) < 1e-12) return null;
  if(Math.abs(qy) < 1e-12) return { vertical:true, at: -r/px };
  return { vertical:false, m: -px/qy, b: -r/qy };
}
function lineEq(a, b){
  if(!a || !b) return false;
  if(a.vertical !== b.vertical) return false;
  if(a.vertical) return Math.abs(a.at - b.at) < 1e-6;
  return Math.abs(a.m - b.m) < 1e-6 && Math.abs(a.b - b.b) < 1e-6;
}

/* main check: returns {ok, nudge} */
function checkAnswer(q, raw){
  const kind = q.kind || "num";
  const tol = q.tol || 1e-6;
  const said = String(raw === undefined || raw === null ? "" : raw).trim();
  if(!said) return { ok:false, nudge:"Nothing entered." };

  // an explicitly-listed wrong answer gets its own coaching line
  const matchWrong = function(){
    if(!q.wrongs) return null;
    for(let k = 0; k < q.wrongs.length; k++){
      const w = q.wrongs[k];
      if(!w || !w.v) continue;
      if(sameAs(kind, said, w.v, tol)) return w.why || null;
    }
    return null;
  };

  if(kind === "text"){
    const list = [q.ans].concat(q.accept || []);
    for(let k = 0; k < list.length; k++){ if(sameText(said, list[k])) return { ok:true }; }
    return { ok:false, nudge: matchWrong() };
  }
  if(kind === "line"){
    const g = parseLine(said), w = parseLine(q.ans);
    if(g && w && lineEq(g,w)) return { ok:true };
    const why = matchWrong();
    if(why) return { ok:false, nudge:why };
    if(g && w && !g.vertical && !w.vertical){
      if(Math.abs(g.m - w.m) < 1e-6) return { ok:false, nudge:"Slope is right — the y-intercept is off. Re-check the substitution step." };
      if(Math.abs(g.b - w.b) < 1e-6) return { ok:false, nudge:"Your y-intercept matches, but the slope does not." };
      if(Math.abs(g.m + w.m) < 1e-6) return { ok:false, nudge:"Right size slope, wrong sign." };
      if(Math.abs(g.m * w.m + 1) < 1e-6) return { ok:false, nudge:"That is the perpendicular slope, not the one asked for." };
    }
    if(!g) return { ok:false, nudge:"Write it as an equation, e.g. y = 2x " + MINUS + " 3." };
    return { ok:false, nudge:null };
  }
  if(kind === "tuple"){
    const w = q.vals;
    let g = parseValues(said);
    if(g && g.length === 1 && q.single !== undefined && q.single !== null){
      // a bare number stands for the one non-zero coordinate
      return cEq(g[0], w[q.single], tol) ? { ok:true } : { ok:false, nudge: matchWrong() };
    }
    if(g && g.length === 2){
      if(cEq(g[0], w[0], tol) && cEq(g[1], w[1], tol)) return { ok:true };
      if(cEq(g[0], w[1], tol) && cEq(g[1], w[0], tol)) return { ok:false, nudge:"Right two numbers, swapped order — the x-coordinate comes first." };
    }
    const why = matchWrong();
    if(why) return { ok:false, nudge:why };
    if(!g) return { ok:false, nudge:"Write it as an ordered pair, e.g. (3, " + MINUS + "2)." };
    return { ok:false, nudge:null };
  }

  // kind === "num"
  if(q.vals === null || q.vals === undefined){                // answer is a phrase like "no solution"
    const list = [q.ans].concat(q.accept || []);
    for(let k = 0; k < list.length; k++){ if(sameText(said, list[k])) return { ok:true }; }
    return { ok:false, nudge: matchWrong() };
  }
  if(isPhrase(said, "nosolution") || isPhrase(said, "allreal")) return { ok:false, nudge: matchWrong() };
  const got = parseValues(said);
  if(!got) return { ok:false, nudge:"That did not read as a number. Try again — you can use / for fractions and √ for roots." };
  if(setEq(got, q.vals, tol)) return { ok:true };
  const why = matchWrong();
  if(why) return { ok:false, nudge:why };
  // diagnostic nudges
  if(got.length === 1 && q.vals.length > 1){
    for(let k = 0; k < q.vals.length; k++){
      if(cEq(got[0], q.vals[k], tol)) return { ok:false, nudge:"That is one correct solution — the question asks for all of them." };
    }
  }
  if(got.length === q.vals.length){
    const neg = q.vals.map(function(v){ return C(-v.re, -v.im); });
    if(setEq(got, neg, tol)) return { ok:false, nudge:"Right values, wrong sign on every one — check your signs." };
    const conj = q.vals.map(function(v){ return C(v.re, -v.im); });
    if(q.vals.some(function(v){ return Math.abs(v.im) > 1e-9; }) && setEq(got, conj, tol))
      return { ok:false, nudge:"Right numbers, but the imaginary part has the wrong sign." };
  }
  if(got.length !== q.vals.length){
    return { ok:false, nudge:"This one has " + q.vals.length + (q.vals.length === 1 ? " answer" : " answers") + " — you gave " + got.length + "." };
  }
  return { ok:false, nudge:null };
}
/* does a student string mean the same thing as a stored wrong answer? */
function sameAs(kind, said, want, tol){
  if(kind === "text") return sameText(said, want);
  if(kind === "line"){ const a = parseLine(said), b = parseLine(want); return !!(a && b && lineEq(a,b)); }
  const a = parseValues(said), b = parseValues(want);
  if(!a || !b) return sameText(said, want);
  return setEq(a, b, tol || 1e-6);
}
/* build the value list for a "num" answer from its own text */
function valsOf(text){ return parseValues(text); }

/* ============================================================
   4. coordinate plane renderer
   ============================================================ */
function planeSVG(o){
  const r = o.r || 6, S = o.size || 300, pad = 16;
  const span = S - pad*2, step = span / (2*r), cx = pad + span/2, cy = pad + span/2;
  const px = function(x){ return cx + x*step; };
  const py = function(y){ return cy - y*step; };
  let s = '<svg class="plane' + (o.clickable ? " clickable" : "") + '" width="' + S + '" height="' + S +
          '" viewBox="0 0 ' + S + ' ' + S + '" role="img" aria-label="' + (o.alt || "coordinate plane") + '">';
  for(let k = -r; k <= r; k++){
    s += '<line class="gl" x1="' + px(k) + '" y1="' + py(-r) + '" x2="' + px(k) + '" y2="' + py(r) + '"></line>';
    s += '<line class="gl" x1="' + px(-r) + '" y1="' + py(k) + '" x2="' + px(r) + '" y2="' + py(k) + '"></line>';
  }
  s += '<line class="ax" x1="' + px(-r) + '" y1="' + py(0) + '" x2="' + px(r) + '" y2="' + py(0) + '"></line>';
  s += '<line class="ax" x1="' + px(0) + '" y1="' + py(-r) + '" x2="' + px(0) + '" y2="' + py(r) + '"></line>';
  const tick = Math.max(1, Math.round(r/5));
  for(let k = -r + 1; k <= r - 1; k++){
    if(k === 0 || k % tick !== 0) continue;
    s += '<text class="tk" x="' + px(k) + '" y="' + (py(0)+11) + '" text-anchor="middle">' + k + '</text>';
    s += '<text class="tk" x="' + (px(0)-5) + '" y="' + (py(k)+3) + '" text-anchor="end">' + k + '</text>';
  }
  if(o.line){
    const L = o.line;
    if(L.vertical !== undefined && L.vertical !== null){
      s += '<line class="ln" x1="' + px(L.vertical) + '" y1="' + py(-r) + '" x2="' + px(L.vertical) + '" y2="' + py(r) + '"></line>';
    } else {
      const y1 = L.m*(-r) + L.b, y2 = L.m*r + L.b;
      const c1 = clamp(y1, -r, r), c2 = clamp(y2, -r, r);
      const x1 = Math.abs(L.m) > 1e-9 ? (c1 - L.b)/L.m : -r;
      const x2 = Math.abs(L.m) > 1e-9 ? (c2 - L.b)/L.m : r;
      s += '<line class="ln" x1="' + px(x1) + '" y1="' + py(c1) + '" x2="' + px(x2) + '" y2="' + py(c2) + '"></line>';
    }
  }
  (o.pts || []).forEach(function(p){
    s += '<circle class="pt' + (p.ghost ? " ghost" : "") + '" cx="' + px(p.x) + '" cy="' + py(p.y) + '" r="5"></circle>';
    if(p.l) s += '<text class="lb" x="' + (px(p.x)+8) + '" y="' + (py(p.y)-7) + '">' + p.l + '</text>';
  });
  s += '</svg>';
  return s;
}
function planeHit(svg, ev, r){
  const box = svg.getBoundingClientRect();
  const S = box.width, pad = 16 * (S / (svg.viewBox.baseVal.width || S));
  const span = S - pad*2, step = span / (2*r), cx = pad + span/2, cy = pad + span/2;
  const cxp = (ev.touches ? ev.touches[0].clientX : ev.clientX) - box.left;
  const cyp = (ev.touches ? ev.touches[0].clientY : ev.clientY) - box.top;
  const x = Math.round((cxp - cx)/step), y = Math.round((cy - cyp)/step);
  return { x: clamp(x, -r, r), y: clamp(y, -r, r) };
}

function E(h){ return '<span class="expr">' + h + "</span>"; }
function stdForm(A, B, Cc){ return E(coefT(A,X) + pmT(B,Y) + " = " + nn(Cc)); }
function mkMC(ans, wrongs){
  const seen = {}; seen[ans] = 1;
  const pool = [];
  (wrongs || []).forEach(function(w){
    if(!w || !w.v || seen[w.v]) return;
    seen[w.v] = 1; pool.push(w);
  });
  const use = R.sample(pool, Math.min(3, pool.length));
  return R.shuffle([{v:ans, ok:true}].concat(use.map(function(w){
    return { v:w.v, ok:false, why:w.why };
  })));
}
function quadName(x, y){
  if(x > 0 && y > 0) return "Quadrant I";
  if(x < 0 && y > 0) return "Quadrant II";
  if(x < 0 && y < 0) return "Quadrant III";
  return "Quadrant IV";
}

T({ id:"quadrant", sec:"2.1", name:"Quadrants and axes", make:function(){

  else { x = 0; y = 0; ans = OR; }

  const wrongs = all.filter(function(z){ return z !== ans; }).map(function(z){
    return { v:z, why:"Signs decide the quadrant: (+,+) is I, (" + MINUS + ",+) is II, (" + MINUS + "," + MINUS + ") is III, (+," + MINUS + ") is IV. A zero coordinate puts the point on an axis instead." };

    : ["The point is " + E(ptT(x,y)) + ".",

        : "A coordinate of 0 means the point sits <em>on</em> an axis, not inside any quadrant.",

  return {

    rule:"<b>Quadrants:</b> I (+,+) · II (" + MINUS + ",+) · III (" + MINUS + "," + MINUS + ") · IV (+," + MINUS + "). Any point with a zero coordinate lies on an axis and is in no quadrant."

T({ id:"intercepts", sec:"2.1", name:"x- and y-intercepts (no graphing)", make:function(){
  const form = R.pick(["slope","std","std","scaled"]);
  let html, A, B, Cc;                    // work in Ax + By = C
  if(form === "slope"){
    const m = R.nz(-6,6), b = R.nz(-12,12);
    if(b % m === 0 || R.chance(0.5)){ /* fine either way */ }
    html = E(Y + " = " + coefT(m,X) + pm(b));
    A = -m; B = 1; Cc = b;
  } else if(form === "std"){
    A = R.nz(-8,8); B = R.nz(-8,8); Cc = R.nz(-24,24);
    html = stdForm(A,B,Cc);
  } else {
    const k = R.i(2,5), m = R.nz(-6,6), c = R.nz(-9,9);
    html = E(coefT(k,Y) + " = " + coefT(m,X) + pm(c));
    A = -m; B = k; Cc = c;
  }
  const wantX = R.chance(0.5);
  const xi = Cc/A, yi = Cc/B;
  const ansT = wantX ? "(" + frT(Cc,A) + ", 0)" : "(0, " + frT(Cc,B) + ")";
  const other = wantX ? "(0, " + frT(Cc,B) + ")" : "(" + frT(Cc,A) + ", 0)";
  const flip = wantX ? "(0, " + frT(Cc,A) + ")" : "(" + frT(Cc,B) + ", 0)";
  const neg = wantX ? "(" + frT(-Cc,A) + ", 0)" : "(0, " + frT(-Cc,B) + ")";
  const wrongs = [
    { v:other, why:"That is the other intercept. The <b>" + (wantX?"x":"y") + "</b>-intercept comes from setting " + (wantX?Y:X) + " = 0." },
    { v:flip,  why:"Right number, wrong slot — an x-intercept is (a, 0) and a y-intercept is (0, b)." },
    { v:neg,   why:"Sign slip when you divided. Move the other term across, then divide by the coefficient carefully." }
  ];
  return {
    prompt: "Find the " + (wantX ? "x" : "y") + "-intercept of " + html + " without graphing.",
    fmt:"Give an ordered pair, e.g. (3, 0). A bare number is fine too.",
    kind:"tuple", ans:ansT, vals:[C(wantX?xi:0,0), C(wantX?0:yi,0)], single: wantX ? 0 : 1,
    ph:"(a, 0)", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "An <b>" + (wantX?"x":"y") + "-intercept</b> is where the graph crosses the " + (wantX?"x":"y") + "-axis, and every point on that axis has " + (wantX ? Y + " = 0" : X + " = 0") + ".",
      "Substitute " + (wantX ? Y + " = 0" : X + " = 0") + " into " + html + ".",
      "That leaves " + E((wantX ? coefT(A,X) : coefT(B,Y)) + " = " + nn(Cc)) + ", so " + (wantX?X:Y) + " = " + E(frH(Cc, wantX?A:B)) + ".",
      "Write it as a point: <b>" + mt(ansT) + "</b>."
    ],
    hint:"Set " + (wantX ? "y = 0 and solve for x" : "x = 0 and solve for y") + ".",
    rule:"<b>Intercepts:</b> x-intercept — set " + Y + " = 0, solve for " + X + ", answer (a, 0). y-intercept — set " + X + " = 0, solve for " + Y + ", answer (0, b)."
  };
}});

T({ id:"solve-for-y", sec:"2.1", name:"Solve an equation for y", make:function(){
  const A = R.nz(-9,9), B = R.nz(-9,9), Cc = R.nz(-20,20);
  const m = -A/B, b = Cc/B;
  const ansT = "y = " + (Math.abs(m) === 1 ? (m < 0 ? MINUS + "x" : "x") : frT(-A,B) + "x") + (Math.abs(b) < 1e-12 ? "" : (b < 0 ? " " + MINUS + " " : " + ") + frT(Math.abs(Cc), Math.abs(B)));
  const ansH = Y + " = " + (Math.abs(m) === 1 ? (m < 0 ? MINUS + X : X) : frH(-A,B) + X) + (Math.abs(b) < 1e-12 ? "" : (b < 0 ? " " + MINUS + " " : " + ") + frH(Math.abs(Cc), Math.abs(B)));
  const wrongs = [
    { v: lineT(A, B, Cc, B), why:"You forgot to change the sign of the " + X + " term when you moved it to the other side." },
    { v: lineT(-A, B, -Cc, B), why:"The constant kept the wrong sign. Divide the whole right side by " + nn(B) + ", including " + nn(Cc) + "." },
    { v: lineT(-B, A, Cc, A), why:"You divided by the wrong coefficient — divide by the number attached to " + Y + "." }
  ];
  return {
    prompt: "Solve " + stdForm(A,B,Cc) + " for " + Y + " in terms of " + X + ".",
    fmt:"Write it in the form y = mx + b.",
    kind:"line", ans:ansT, ansHtml:ansH, ph:"y = ...", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "Start with " + stdForm(A,B,Cc) + ". The goal is " + Y + " alone on one side.",
      "Subtract " + E(coefT(A,X)) + " from both sides: " + E(coefT(B,Y) + " = " + coefT(-A,X) + pm(Cc)) + ".",
      "Divide <em>every</em> term by " + nn(B) + ": " + E(ansH) + ".",
      "Reduce each fraction. Answer: <b>" + ansH + "</b>."
    ],
    hint:"Move the x-term across first, then divide every term by the coefficient of y.",
    rule:"<b>Solving for a variable:</b> undo addition first, multiplication second — and divide <em>every</em> term, not just the one you are looking at."
  };
}});

T({ id:"distance", sec:"2.1", name:"Distance between two points", make:function(){
  const x1 = R.i(-9,9), y1 = R.i(-9,9);
  let x2 = R.i(-9,9), y2 = R.i(-9,9);
  while(x2 === x1 && y2 === y1){ x2 = R.i(-9,9); y2 = R.i(-9,9); }
  const dx = x2-x1, dy = y2-y1, d2 = dx*dx + dy*dy;
  if(dx === 0 || dy === 0) return null;      // keep the distractors genuinely distinct
  const exact = radT(d2);
  const dec = Math.sqrt(d2);
  const rounded = !isSq(d2) && R.chance(0.35);
  const ansT = rounded ? dec.toFixed(2) : exact;
  const wrongs = [
    { v: radT(Math.abs(dx*dx - dy*dy) || 5), why:"You subtracted the squares. The distance formula <em>adds</em> them: (" + MINUS + "x)² + (" + MINUS + "y)²." },
    { v: String(Math.abs(dx) + Math.abs(dy)), why:"That is the walking distance along the grid, not the straight-line distance. Square, add, then take the root." },
    { v: String(d2), why:"You stopped one step early — that is d², so take the square root of it." }
  ];
  return {
    prompt: "Find the distance between " + E(ptT(x1,y1)) + " and " + E(ptT(x2,y2)) + ".",
    fmt: rounded ? "Round to two decimal places." : "Give the exact answer in simplest radical form (a decimal rounded to 2 places is also accepted).",
    kind:"num", ans:ansT, alt: rounded ? [exact] : [dec.toFixed(2)], tol: 0.0051,
    ph: rounded ? "0.00" : "e.g. 2√13", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "Distance formula: " + E("d = " + radH("(x₂ " + MINUS + " x₁)² + (y₂ " + MINUS + " y₁)²")) + ".",
      "Subtract the coordinates first: " + E("x₂ " + MINUS + " x₁ = " + nn(x2) + " " + MINUS + " (" + nn(x1) + ") = " + nn(dx)) + " and " + E("y₂ " + MINUS + " y₁ = " + nn(y2) + " " + MINUS + " (" + nn(y1) + ") = " + nn(dy)) + ".",
      "Square each and add: " + E("(" + nn(dx) + ")² + (" + nn(dy) + ")² = " + (dx*dx) + " + " + (dy*dy) + " = " + d2) + ".",
      "Take the square root: " + E("d = " + radH(String(d2)) + " = " + (isSq(d2) ? exact : radHtml(d2) + " ≈ " + dec.toFixed(2))) + "." +
        (isSq(d2) || simpRad(d2)[0] === 1 ? "" : " Pull out the perfect-square factor to simplify the radical."),
      "Answer: <b>" + mt(ansT) + "</b>."
    ],
    hint:"Subtract the x's, subtract the y's, square both, add, square root. Order matters — never square before subtracting.",
    rule:"<b>Distance:</b> d = √((x₂ " + MINUS + " x₁)² + (y₂ " + MINUS + " y₁)²). Because both differences get squared, it does not matter which point you call first."
  };
}});

T({ id:"midpoint", sec:"2.1", name:"Midpoint of a segment", make:function(){
  const x1 = R.i(-11,11), y1 = R.i(-11,11), x2 = R.i(-11,11), y2 = R.i(-11,11);

  const wrongs = [

    { v:"(" + nn(mxN) + ", " + nn(myN) + ")", why:"You added but forgot to divide by 2." },
    { v:"(" + frT(myN,2) + ", " + frT(mxN,2) + ")", why:"Coordinates are swapped — the x-average goes first." }

  return {
    prompt: "Find the midpoint of the segment joining " + E(ptT(x1,y1)) + " and " + E(ptT(x2,y2)) + ".",

    hint:"Add the two x's and halve; add the two y's and halve.",

      prompt: "On a city map, " + nm[0] + " is at " + E(ptT(x1,y1)) + " and " + nm[1] + " is at " + E(ptT(x2,y2)) + ", where each unit is one block. A coffee shop sits exactly halfway between them. Where is it?",
      fmt:"Give an ordered pair.",
      kind:"tuple", ans:ansT, vals:[C((x1+x2)/2,0), C((y1+y2)/2,0)], ph:"(a, b)", wrongs:wrongs, mc:mkMC(ansT, wrongs),
      steps:[
        "\"Exactly halfway between\" is the midpoint.",
        "Average the x-coordinates: " + E("(" + nn(x1) + " + " + nn(x2) + ")/2 = " + frH(x1+x2,2)) + ".",
        "Average the y-coordinates: " + E("(" + nn(y1) + " + " + nn(y2) + ")/2 = " + frH(y1+y2,2)) + ".",
        "The coffee shop is at <b>" + mt(ansT) + "</b>."
      ],
      hint:"Halfway between two points is the midpoint — average each coordinate.",
      rule:"<b>Word cue:</b> \"halfway\", \"midway\", \"the middle\" all signal the midpoint formula."
    };
  }
  const exact = radT(d2), dec = Math.sqrt(d2);
  const wrongs = [
    { v:String(Math.abs(dx) + Math.abs(dy)), why:"That is the distance walking along the streets. \"Straight line\" means the distance formula." },
    { v:String(d2), why:"That is d² — you still need the square root." },
    { v:radT(Math.abs(dx*dx - dy*dy) || 7), why:"The formula adds the squared differences; it does not subtract them." }
  ];
  return {
    prompt: "On a city map, " + nm[0] + " is at " + E(ptT(x1,y1)) + " and " + nm[1] + " is at " + E(ptT(x2,y2)) + ", where each unit is one block. How far apart are they in a straight line?",
    fmt:"Exact radical form, or a decimal rounded to two places.",
    kind:"num", ans:exact, alt:[dec.toFixed(2)], tol:0.0051, ph:"e.g. 2√13", wrongs:wrongs, mc:mkMC(exact, wrongs),
    steps:[
      "\"Straight line\" between two plotted points means the distance formula.",
      "Differences: " + E(MINUS + "x = " + nn(dx)) + " and " + E(MINUS + "y = " + nn(dy)) + ".",
      "Square and add: " + E((dx*dx) + " + " + (dy*dy) + " = " + d2) + ".",
      "Square root: " + E(radH(String(d2)) + " = " + radHtml(d2)) + " ≈ " + dec.toFixed(2) + " blocks."
    ],
    hint:"Plot the two points mentally, then use d = √((Δx)² + (Δy)²).",
    rule:"<b>Word cue:</b> \"straight-line distance\", \"as the crow flies\", \"how far apart\" all signal the distance formula."
  };
}});

/* ============================================================
   SECTION 2.2 — Linear Equations in One Variable
   ============================================================ */
function lcm(a,b){ return Math.abs(a*b)/(gcd(a,b) || 1); }
function denOf(a,b){ const g = gcd(a,b) || 1; return Math.abs(b/g); }
/* y = (mn/md)x + (bn/bd), as plain text and as html */
function lineT(mn, md, bn, bd){
  const ms = frT(mn, md);
  let s = "y = ";
  if(mn === 0) return "y = " + frT(bn, bd);
  s += (ms === "1") ? "x" : (ms === MINUS + "1" ? MINUS + "x" : ms + "x");
  if(bn !== 0){
    const neg = (bn/bd) < 0;
    s += (neg ? " " + MINUS + " " : " + ") + frT(Math.abs(bn), Math.abs(bd));
  }
  return s;
}
function lineH(mn, md, bn, bd){
  const ms = frT(mn, md);
  if(mn === 0) return Y + " = " + frH(bn, bd);
  let s = Y + " = ";
  s += (ms === "1") ? X : (ms === MINUS + "1" ? MINUS + X : frH(mn, md) + X);
  if(bn !== 0){
    const neg = (bn/bd) < 0;
    s += (neg ? " " + MINUS + " " : " + ") + frH(Math.abs(bn), Math.abs(bd));
  }
  return s;
}
/* display a line with slope p/q through intercept b, in a randomly chosen form */
function lineDisplay(p, q, b){
  if(R.chance(0.5)) return E(lineH(p, q, b*q, q));
  return stdForm(-p, q, q*b);          // −px + qy = qb
}

T({ id:"linear-eq", sec:"2.2", name:"Multi-step linear equations", make:function(){
  const s = R.nz(-9,9);
  let a = R.nz(-6,6), d = R.nz(-6,6);
  while(a === d) d = R.nz(-6,6);
  const b = R.i(-8,8), e = R.i(-8,8);
  const c = d*(s+e) - a*(s+b);
  const lhs = coefT(a, "(" + X + pm(b) + ")") + (c === 0 ? "" : pm(c));
  const rhs = coefT(d, "(" + X + pm(e) + ")");
  const ansT = "x = " + nn(s);
  const wrongs = [
    { v:"x = " + nn(-s), why:"Sign slip in the last step — when you divide, the sign of the constant comes along with it." },
    { v:"x = " + nn(s + R.pick([1,-1,2,-2])), why:"Check your arithmetic collecting like terms; recount the constants on each side." },
    { v:"x = " + frT(s*2+1, 2), why:"Distribute to <em>every</em> term inside the parentheses before combining." }
  ];
  return {
    prompt: "Solve for " + X + ": " + E(lhs + " = " + rhs),
    kind:"num", ans:ansT, ph:"x = ", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "Distribute on both sides: " + E(coefT(a,X) + pm(a*b) + (c === 0 ? "" : pm(c)) + " = " + coefT(d,X) + pm(d*e)) + ".",
      "Combine the constants on the left: " + E(coefT(a,X) + pm(a*b + c) + " = " + coefT(d,X) + pm(d*e)) + ".",
      "Get the " + X + " terms on one side and the numbers on the other: " + E(coefT(a-d, X) + " = " + nn(d*e - a*b - c)) + ".",
      "Divide both sides by " + nn(a-d) + ": <b>" + mt(ansT) + "</b>.",
      "Check by substituting: both sides come out to " + nn(d*(s+e)) + ". ✓"
    ],
    hint:"Distribute first, then collect all the x's on one side and all the plain numbers on the other.",
    rule:"<b>Linear equations:</b> distribute → combine like terms → variables one side, constants the other → divide. Always check by substituting back."
  };
}});

T({ id:"linear-fractions", sec:"2.2", name:"Equations with fractions", make:function(){
  const L = R.pick([2,3,4,6,12]);
  const s = R.nz(-7,7);
  let A = R.nz(-12,12), Cc = R.nz(-12,12);
  while(A === Cc) Cc = R.nz(-12,12);
  const B = R.i(-12,12);
  const D = (A - Cc)*s + B;
  const dens = [denOf(A,L), denOf(B,L), denOf(Cc,L), denOf(D,L)];
  const lcd = dens.reduce(function(p,q){ return lcm(p,q); }, 1);
  const k = lcd / L;
  const iA = A*k, iB = B*k, iCc = Cc*k, iD = D*k;
  const left  = frH(A,L) + X + (B === 0 ? "" : (B/L < 0 ? " " + MINUS + " " : " + ") + frH(Math.abs(B), L));
  const right = frH(Cc,L) + X + (D === 0 ? "" : (D/L < 0 ? " " + MINUS + " " : " + ") + frH(Math.abs(D), L));
  const ansT = "x = " + nn(s);
  const wrongs = [
    { v:"x = " + nn(-s), why:"Watch the signs when you move terms across after clearing the denominators." },
    { v:"x = " + frT(s, 2), why:"You multiplied only part of the equation by the LCD. Every term on both sides gets multiplied." },
    { v:"x = " + nn(s + R.pick([2,-2,3,-3])), why:"Recheck the multiplication: LCD × each fraction, one term at a time." }
  ];
  return {
    prompt: "Solve for " + X + ": " + E(left + " = " + right),
    kind:"num", ans:ansT, ph:"x = ", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "Fractions are the only hard part, so clear them. The least common denominator is <b>" + lcd + "</b>.",
      "Multiply <em>every</em> term on both sides by " + lcd + ": " + E(coefT(iA,X) + (iB === 0 ? "" : pm(iB)) + " = " + coefT(iCc,X) + (iD === 0 ? "" : pm(iD))) + ".",
      "Now it is an ordinary linear equation. Collect the " + X + " terms: " + E(coefT(iA - iCc, X) + " = " + nn(iD - iB)) + ".",
      "Divide by " + nn(iA - iCc) + ": <b>" + mt(ansT) + "</b>."
    ],
    hint:"Multiply every single term by the LCD of all the denominators — that turns it into a plain linear equation.",
    rule:"<b>Fractional equations:</b> multiply both sides by the LCD first. Multiplying only some terms is the most common way to lose this problem."
  };
}});

T({ id:"classify-eq", sec:"2.2", name:"Identity, conditional, or no solution", make:function(){
  const type = R.pick(["cond","cond","none","all"]);
  let lhs, rhs, ans, steps;
  const ALL = "All real numbers — it is an identity", NONE = "No solution", a = R.nz(2,6), b = R.nz(-9,9);
  if(type === "all"){
    lhs = coefT(a, "(" + X + pm(b) + ")");
    rhs = coefT(a, X) + pm(a*b);
    ans = ALL;
    steps = [
      "Distribute the left side: " + E(coefT(a,X) + pm(a*b)) + ".",
      "Compare with the right side: " + E(rhs) + ". They are the same expression.",
      "Subtracting " + E(coefT(a,X)) + " from both sides leaves " + E(nn(a*b) + " = " + nn(a*b)) + ", which is true no matter what " + X + " is.",
      "So <b>every real number</b> is a solution — the equation is an identity."
    ];
  } else if(type === "none"){
    const c2 = b + R.nz(1,7);
    lhs = coefT(a, X) + pm(b);
    rhs = coefT(a, X) + pm(c2);
    ans = NONE;
    steps = [
      "Both sides have the same " + X + " term, " + E(coefT(a,X)) + ".",
      "Subtract " + E(coefT(a,X)) + " from both sides: " + E(nn(b) + " = " + nn(c2)) + ".",
      "The variable is gone and what remains is false — " + nn(b) + " does not equal " + nn(c2) + ".",
      "A false statement means <b>no solution</b>: no value of " + X + " can ever work."
    ];
  } else {
    const s = R.nz(-7,7);
    let d = R.nz(-6,6);
    while(d === a) d = R.nz(-6,6);
    const c = a*s + b - d*s;          // ax + b = dx + c holds at x = s
    lhs = coefT(a, X) + (b === 0 ? "" : pm(b));
    rhs = coefT(d, X) + (c === 0 ? "" : pm(c));
    ans = "Exactly one solution: x = " + nn(s);
    steps = [
      "Collect the " + X + " terms: " + E(coefT(a-d, X) + " = " + nn(c-b)) + ".",
      "The variable did <em>not</em> cancel, so there is exactly one solution.",
      "Divide: " + E(X + " = " + nn(s)) + ".",
      "One value works and no other does — this is a <b>conditional</b> equation."
    ];
  }
  const bank = [ALL, NONE, "Exactly one solution: x = " + nn(R.i(-7,7)), "Exactly one solution: x = " + nn(R.i(-7,7) + 11)];
  const wrongs = bank.filter(function(z){ return z !== ans; }).map(function(z){
    return { v:z, why:"Solve it out and watch what happens to the variable: if it cancels and leaves something true, every real number works; if it cancels and leaves something false, there is no solution; if it survives, there is exactly one." };
  });
  return {
    prompt: "Solve and classify: " + E(lhs + " = " + rhs),
    kind:"mc", ans:ans, mc:mkMC(ans, wrongs), steps:steps,
    hint:"Simplify both sides. Does the variable cancel out? What is left when it does?",
    rule:"<b>Three outcomes:</b> variable survives → one solution (conditional). Variable cancels, true statement → all reals (identity). Variable cancels, false statement → no solution."
  };
}});

T({ id:"excluded-values", sec:"2.2", name:"Excluded values of a rational equation", make:function(){
  const p = R.nz(-9,9);
  let q = R.nz(-9,9);
  while(q === p) q = R.nz(-9,9);
  const useZero = R.chance(0.3);
  const A = R.nz(2,9), B = R.nz(2,9), Cc = R.nz(2,9);
  const d1 = useZero ? X : "(" + X + pm(-p) + ")";
  const d2 = "(" + X + pm(-q) + ")";
  const vals = useZero ? [0, q] : [p, q];
  const sorted = vals.slice().sort(function(a,b){ return a-b; });
  const ansT = sorted.map(nn).join(", ");
  const wrongs = [
    { v: sorted.map(function(z){ return nn(-z); }).join(", "), why:"Sign error — set each denominator equal to zero and solve. " + E(X + " " + MINUS + " 4 = 0") + " gives " + E(X + " = 4") + ", not " + E(X + " = " + MINUS + "4") + "." },
    { v: nn(sorted[0]), why:"Every denominator has to be checked, not just the first one." },
    { v:"no solution", why:"The question is not asking you to solve — it asks which values " + X + " may never take." }
  ];
  return {
    prompt: "State the value(s) of " + X + " that must be excluded from " +
      E("<span class='fr'><span>" + A + "</span><span>" + (useZero ? X : X + pm(-p)) + "</span></span> + " +
        "<span class='fr'><span>" + B + "</span><span>" + X + pm(-q) + "</span></span> = " + nn(Cc)) + ".",
    fmt:"List every excluded value, separated by commas.",
    kind:"num", ans:ansT, ph:"e.g. 3, −5", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "Division by zero is undefined, so any " + X + " that makes a denominator 0 is excluded from the domain.",
      "Set the first denominator to zero: " + E((useZero ? X : X + pm(-p)) + " = 0") + " gives " + E(X + " = " + nn(vals[0])) + ".",
      "Set the second denominator to zero: " + E(X + pm(-q) + " = 0") + " gives " + E(X + " = " + nn(q)) + ".",
      "Excluded values: <b>" + mt(ansT) + "</b>. If solving the equation later produces one of these, throw it out as extraneous."
    ],
    hint:"Set each denominator equal to zero and solve — those are the forbidden values.",
    rule:"<b>Excluded values:</b> anything that zeroes a denominator. Find them <em>before</em> you solve, so you know what to reject at the end."
  };
}});

T({ id:"rational-eq", sec:"2.2", name:"Solving rational equations", make:function(){
  const p = R.nz(-8,8), A = R.nz(2,9), B = R.nz(-6,6);
  const extraneous = R.chance(0.28);
  const k = extraneous ? 0 : R.nz(-5,5);
  const Cc = A + B*k;
  const sol = p + k;
  const eq = "<span class='fr'><span>" + A + "</span><span>x" + pm(-p) + "</span></span>" + pm(B).replace(/^ /, " ") +
             " = <span class='fr'><span>" + Cc + "</span><span>x" + pm(-p) + "</span></span>";
  const ansT = extraneous ? "no solution" : "x = " + nn(sol);
  const wrongs = extraneous
    ? [ { v:"x = " + nn(p), why:"You found " + E(X + " = " + nn(p)) + " correctly — but that value makes the denominator zero, so it is <b>extraneous</b> and must be rejected. The answer is no solution." },
        { v:"x = " + nn(p + 1), why:"Recheck the algebra after multiplying through by the denominator." },
        { v:"all real numbers", why:"The variable does not cancel here — multiply through and solve, then check against the excluded value." } ]
    : [ { v:"x = " + nn(p), why:"That is the excluded value, not the solution — it would make a denominator zero." },
        { v:"x = " + nn(k), why:"You forgot to add " + nn(p) + " back: solving gave " + E(X + " " + MINUS + " " + nn(p) + " = " + nn(k)) + "." },
        { v:"no solution", why:"The solution " + E(X + " = " + nn(sol)) + " does <em>not</em> make the denominator zero, so it is valid — check it before rejecting it." } ];
  return {
    prompt: "Solve: " + E(eq),
    fmt:"Check your answer against the excluded value.",
    kind:"num", ans:ansT, accept: extraneous ? ["no solution"] : [], ph:"x = ", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "First, the excluded value: " + E(X + pm(-p) + " = 0") + " when " + E(X + " = " + nn(p)) + ", so " + X + " may never equal " + nn(p) + ".",
      "Multiply every term by " + E("(" + X + pm(-p) + ")") + " to clear the fractions: " + E(nn(A) + pmT(B, "(" + X + pm(-p) + ")").replace(/^ /, " ") + " = " + nn(Cc)) + ".",
      "Solve the linear equation: " + E(coefT(B, "(" + X + pm(-p) + ")") + " = " + nn(Cc - A)) + ", so " + E(X + pm(-p) + " = " + nn(k)) + " and " + E(X + " = " + nn(sol)) + ".",
      extraneous
        ? "But " + E(X + " = " + nn(sol)) + " is exactly the excluded value — it makes the denominator zero. It is <b>extraneous</b>, so the equation has <b>no solution</b>."
        : "Check: " + nn(sol) + " ≠ " + nn(p) + ", so it does not zero the denominator. The solution is <b>" + E(X + " = " + nn(sol)) + "</b>."
    ],
    hint:"Find the excluded value first, clear the denominators, solve — then check the answer against the excluded value.",
    rule:"<b>Rational equations:</b> a solution that matches an excluded value is <em>extraneous</em> and gets thrown out. If the only solution is extraneous, the answer is \"no solution\"."
  };
}});

T({ id:"slope", sec:"2.2", name:"Slope from two points", make:function(){
  const vertical = R.chance(0.12);
  const x1 = R.i(-9,9), y1 = R.i(-9,9);
  let x2 = vertical ? x1 : R.i(-9,9), y2 = R.i(-9,9);
  while((!vertical && x2 === x1) || (y2 === y1 && x2 === x1)){ x2 = vertical ? x1 : R.i(-9,9); y2 = R.i(-9,9); }
  const dy = y2-y1, dx = x2-x1;
  const ansT = vertical ? "undefined" : frT(dy, dx);
  const wrongs = vertical
    ? [ { v:"0", why:"A slope of 0 is a <em>horizontal</em> line. Here the run is zero, which makes the slope undefined." },
        { v:frT(1,1), why:"Both points have the same x-coordinate, so the run is 0 and you cannot divide by it." },
        { v:"1/0", why:"Division by zero is undefined — say \"undefined\", not a fraction." } ]
    : [ { v: dy === 0 ? "undefined" : (frT(dx, dy) === ansT ? frT(dx + 1, dy) : frT(dx, dy)), why: dy === 0 ? "This line is <em>horizontal</em>: the rise is 0, so m = 0. Undefined slope belongs to vertical lines." : "You flipped it. Slope is <b>rise over run</b>: " + E("(y₂ " + MINUS + " y₁)/(x₂ " + MINUS + " x₁)") + ", y on top." },
        { v:frT(-dy, dx), why:"Sign error in a subtraction — take both differences in the same order." },
        { v:frT(y1+y2, x1+x2 || 1), why:"Slope subtracts the coordinates; it does not add them." } ];
  return {
    prompt: "Find the slope of the line through " + E(ptT(x1,y1)) + " and " + E(ptT(x2,y2)) + ".",
    fmt:"Give a fraction in lowest terms, or \"undefined\".",
    kind:"num", ans:ansT, accept: vertical ? ["undefined"] : [], ph:"m = ", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "Slope is " + E("m = (y₂ " + MINUS + " y₁)/(x₂ " + MINUS + " x₁)") + " — rise over run.",
      "Rise: " + E(nn(y2) + " " + MINUS + " (" + nn(y1) + ") = " + nn(dy)) + ".",
      "Run: " + E(nn(x2) + " " + MINUS + " (" + nn(x1) + ") = " + nn(dx)) + ".",
      vertical
        ? "The run is 0, and dividing by zero is undefined. The line is <b>vertical</b>, so its slope is <b>undefined</b>."
        : "m = " + E(frH(dy,dx)) + ", reduced. Answer: <b>" + mt(ansT) + "</b>."
    ],
    hint:"Rise over run — subtract the y's on top, the x's on the bottom, in the same order.",
    rule:"<b>Slope:</b> m = Δy/Δx. Horizontal line → m = 0. Vertical line → slope undefined (zero run)."
  };
}});

T({ id:"write-line", sec:"2.2", name:"Writing the equation of a line", make:function(){
  const fromTwo = R.chance(0.55);
  const p = R.nz(-6,6);
  let q = R.i(1,6);
  const g = gcd(p,q) || 1;
  const mn = p/g, md = q/g;
  const x1 = md*R.i(-3,3), b = R.i(-8,8);
  const y1 = mn*(x1/md) + b;
  const x2 = x1 + md*R.nz(1,3), y2 = mn*((x2)/md) + b;
  const ansT = lineT(mn, md, b, 1), ansH = lineH(mn, md, b, 1);
  const wrongs = [
    { v: lineT(md, mn, b, 1), why:"Slope is upside down — rise goes on top." },
    { v: lineT(mn, md, -b, 1), why:"Sign slip on the y-intercept when you solved for b." },
    { v: lineT(-mn, md, b, 1), why:"Wrong sign on the slope; recheck the subtraction order." }
  ];
  return {
    prompt: fromTwo
      ? "Write the equation of the line through " + E(ptT(x1,y1)) + " and " + E(ptT(x2,y2)) + "."
      : "Write the equation of the line with slope " + E(frH(mn,md)) + " passing through " + E(ptT(x1,y1)) + ".",
    fmt:"Give your answer in slope-intercept form, y = mx + b.",
    kind:"line", ans:ansT, ansHtml:ansH, ph:"y = ", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      fromTwo
        ? "First the slope: " + E("m = (" + nn(y2) + " " + MINUS + " (" + nn(y1) + "))/(" + nn(x2) + " " + MINUS + " (" + nn(x1) + ")) = " + frH(mn,md)) + "."
        : "The slope is given: " + E("m = " + frH(mn,md)) + ".",
      "Use point-slope form with " + E(ptT(x1,y1)) + ": " + E(Y + " " + MINUS + " (" + nn(y1) + ") = " + frH(mn,md) + "(" + X + " " + MINUS + " (" + nn(x1) + "))") + ".",
      "Distribute and solve for " + Y + ".",
      "Slope-intercept form: <b>" + ansH + "</b>. Check it by substituting " + E(ptT(x1,y1)) + " — it satisfies the equation. ✓"
    ],
    hint:"Get the slope, drop it into point-slope form y " + MINUS + " y₁ = m(x " + MINUS + " x₁), then solve for y.",
    rule:"<b>Point-slope:</b> y " + MINUS + " y₁ = m(x " + MINUS + " x₁). <b>Slope-intercept:</b> y = mx + b. Point-slope is faster when you have a point and a slope."
  };
}});

T({ id:"par-perp-id", sec:"2.2", name:"Parallel, perpendicular, or neither", make:function(){
  const rel = R.pick(["par","perp","neither"]);
  const p = R.nz(-5,5), q = R.i(1,5);
  const g = gcd(p,q) || 1;
  const mn = p/g, md = q/g;
  let m2n, m2d;
  if(rel === "par"){ m2n = mn; m2d = md; }
  else if(rel === "perp"){ m2n = -md; m2d = mn; if(m2d < 0){ m2n = -m2n; m2d = -m2d; } }
  else {
    do {
      const r = R.nz(-5,5), s2 = R.i(1,5), g2 = gcd(r,s2) || 1;
      m2n = r/g2; m2d = s2/g2;
    } while(Math.abs(m2n/m2d - mn/md) < 1e-9 || Math.abs((m2n/m2d)*(mn/md) + 1) < 1e-9);
  }
  const b1 = R.i(-6,6);
  let b2 = R.i(-6,6);
  if(rel === "par" && b2 === b1) b2 = b1 + 2;
  const ans = rel === "par" ? "Parallel" : rel === "perp" ? "Perpendicular" : "Neither";
  const wrongs = ["Parallel","Perpendicular","Neither"].filter(function(z){ return z !== ans; }).map(function(z){
    return { v:z, why:"Put both lines in " + E(Y + " = m" + X + " + b") + " form and compare slopes: equal → parallel; product " + MINUS + "1 (negative reciprocals) → perpendicular; otherwise neither." };
  });
  return {
    prompt: "Are these two lines parallel, perpendicular, or neither?<br>" +
            lineDisplay(mn, md, b1) + "<br>" + lineDisplay(m2n, m2d, b2),
    kind:"mc", ans:ans, mc:mkMC(ans, wrongs),
    steps:[
      "Rewrite each line in slope-intercept form so the slopes are visible.",
      "First slope: " + E("m₁ = " + frH(mn,md)) + ". Second slope: " + E("m₂ = " + frH(m2n,m2d)) + ".",
      rel === "par" ? "The slopes are equal (and the intercepts differ), so the lines never meet — they are <b>parallel</b>."
        : rel === "perp" ? "The product is " + E("m₁ · m₂ = " + frH(mn,md) + " · " + frH(m2n,m2d) + " = " + MINUS + "1") + ", so the slopes are negative reciprocals — the lines are <b>perpendicular</b>."
        : "The slopes are not equal, and their product is " + E(frT(mn*m2n, md*m2d)) + ", not " + MINUS + "1. So the lines are <b>neither</b> parallel nor perpendicular.",
      "Remember the intercepts do not matter for this question — only the slopes do."
    ],
    hint:"Solve each for y, then compare slopes: equal, negative reciprocals, or neither.",
    rule:"<b>Parallel:</b> m₁ = m₂. <b>Perpendicular:</b> m₁ · m₂ = " + MINUS + "1, i.e. flip and negate. Two positive slopes can never be perpendicular."
  };
}});

T({ id:"par-perp-write", sec:"2.2", name:"Writing parallel & perpendicular lines", make:function(){
  const wantPar = R.chance(0.5);
  const p = R.nz(-5,5), q = R.i(1,5), g = gcd(p,q) || 1;
  const mn = p/g, md = q/g;
  const b1 = R.i(-7,7);
  const x0 = md*R.i(-4,4), y0 = R.i(-8,8);
  let nmn, nmd;
  if(wantPar){ nmn = mn; nmd = md; }
  else { nmn = -md; nmd = mn; if(nmd < 0){ nmn = -nmn; nmd = -nmd; } }
  // b = y0 − m·x0  as a fraction over nmd
  const bn = y0*nmd - nmn*x0, bd = nmd;
  const ansT = lineT(nmn, nmd, bn, bd), ansH = lineH(nmn, nmd, bn, bd);
  const oMn = wantPar ? -md : mn, oMd = wantPar ? mn : md;
  const om = (oMd < 0) ? [-oMn, -oMd] : [oMn, oMd];
  const wrongs = [
    { v: lineT(om[0], om[1], y0*om[1] - om[0]*x0, om[1]),
      why: wantPar ? "That uses the perpendicular slope. Parallel means the <em>same</em> slope." : "That uses the same slope. Perpendicular means the <em>negative reciprocal</em>." },
    { v: lineT(nmn, nmd, -bn, bd), why:"Sign error solving for b — substitute the point and isolate b carefully." },
    { v: lineT(nmn, nmd, y0, 1), why:"You used the point's y-coordinate as the intercept. It only equals b when the point is on the y-axis." }
  ];
  return {
    prompt: "Write the equation of the line through " + E(ptT(x0,y0)) + " that is <b>" + (wantPar ? "parallel" : "perpendicular") + "</b> to " + lineDisplay(mn, md, b1) + ".",
    fmt:"Answer in slope-intercept form.",
    kind:"line", ans:ansT, ansHtml:ansH, ph:"y = ", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "Find the slope of the given line: " + E("m = " + frH(mn,md)) + ".",
      wantPar
        ? "Parallel lines share a slope, so the new line also has " + E("m = " + frH(nmn,nmd)) + "."
        : "Perpendicular means the negative reciprocal: flip " + E(frH(mn,md)) + " and change its sign to get " + E("m = " + frH(nmn,nmd)) + ".",
      "Substitute the point " + E(ptT(x0,y0)) + " into " + E(Y + " = m" + X + " + b") + ": " + E(nn(y0) + " = " + frH(nmn,nmd) + "(" + nn(x0) + ") + b") + ".",
      "Solve for b: " + E("b = " + frH(bn,bd)) + ".",
      "Answer: <b>" + ansH + "</b>."
    ],
    hint: wantPar ? "Same slope, new point." : "Flip the slope and change its sign, then use the point to find b.",
    rule:"<b>Perpendicular slope:</b> flip and negate. The negative reciprocal of " + E(frH(2,3)) + " is " + E(frH(-3,2)) + "."
  };
}});

T({ id:"hv-lines", sec:"2.2", name:"Horizontal & vertical lines", make:function(){

      { v: horiz ? "y = " + nn(x0) : "x = " + nn(y0), why:"You used the wrong coordinate — a horizontal line is y = (the y-value), a vertical line is x = (the x-value)." },

      steps:[

              : "A vertical line has undefined slope — the x-value never changes as you move along it.",
        horiz ? "Every point on it has the same y-coordinate as " + E(ptT(x0,y0)) + ", namely " + nn(y0) + "."
              : "Every point on it has the same x-coordinate as " + E(ptT(x0,y0)) + ", namely " + nn(x0) + ".",
        "So the equation is <b>" + mt(ansT) + "</b>."

      hint: horiz ? "Horizontal lines look like y = a number." : "Vertical lines look like x = a number.",

  }

  const c = R.nz(-9,9);

    { v: horiz ? "undefined" : "0", why: horiz ? E(Y + " = " + nn(c)) + " is horizontal: it rises 0 for any run, so m = 0." : E(X + " = " + nn(c)) + " is vertical: the run is 0, and you cannot divide by zero." },
    { v: nn(c), why:"The number in the equation is a position, not a slope." },

  return {
    prompt:"What is the slope of the line " + E((horiz ? Y : X) + " = " + nn(c)) + "?",
    kind:"num", ans:ansT, accept: horiz ? [] : ["undefined"], ph:"m = ", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      horiz ? "The equation " + E(Y + " = " + nn(c)) + " says: whatever " + X + " does, " + Y + " stays at " + nn(c) + "."
            : "The equation " + E(X + " = " + nn(c)) + " says: whatever " + Y + " does, " + X + " stays at " + nn(c) + ".",
      horiz ? "Pick two points on it, say " + E(ptT(0,c)) + " and " + E(ptT(5,c)) + ". The rise is 0."
            : "Pick two points on it, say " + E(ptT(c,0)) + " and " + E(ptT(c,5)) + ". The run is 0.",
      horiz ? "m = 0/5 = <b>0</b>. Horizontal lines are flat." : "m = 5/0, which is <b>undefined</b>. Vertical lines have no slope."
    ],
    hint:"Sketch it. Flat line or straight up-and-down?",
    rule:"<b>Horizontal</b> (y = c): slope 0. <b>Vertical</b> (x = c): slope undefined. Zero slope and undefined slope are not the same thing."
  };

T({ id:"concept-22", sec:"2.2", name:"Linear equation concepts", make:function(){
  const bank = [
    { q:"What does it mean for two lines to be perpendicular?",
      a:"They intersect at a right angle; unless one is vertical, their slopes are negative reciprocals (m₁ · m₂ = " + MINUS + "1).",
      w:["They never intersect, no matter how far they are extended.",
         "They have the same slope but different y-intercepts.",
         "They have slopes that are reciprocals of each other, with the same sign."],
      s:["Perpendicular lines cross at 90°.",
         "Algebraically that means one slope is the other flipped <em>and</em> negated.",
         "So their product is always " + MINUS + "1 — which also tells you two positive slopes can never be perpendicular."] },
    { q:"Can two lines with positive slopes be perpendicular?",
      a:"No — the product of two positive numbers can never equal " + MINUS + "1.",
      w:["Yes, as long as one slope is much steeper than the other.",
         "Yes, if the slopes are reciprocals such as 2 and 1/2.",
         "Yes, but only if both lines pass through the origin."],
      s:["Perpendicular requires " + E("m₁ · m₂ = " + MINUS + "1") + ".",
         "If both slopes are positive, their product is positive.",
         "A positive number cannot equal " + MINUS + "1, so it is impossible — one slope must be positive and the other negative."] },
    { q:"How do you recognize that an equation is a rational equation?",
      a:"The variable appears in a denominator.",
      w:["It contains fractions with numbers in the denominators.",
         "It has a squared term.",
         "It can be written in the form y = mx + b."],
      s:["A fraction with only numbers underneath, like " + E(frH(3,4) + X) + ", is still an ordinary linear equation.",
         "What makes an equation <em>rational</em> is a variable in the denominator, like " + E("<span class='fr'><span>3</span><span>x " + MINUS + " 2</span></span>") + ".",
         "That is what creates excluded values and the risk of extraneous solutions."] },
    { q:"Why can a rational equation have a solution that must be rejected?",
      a:"Multiplying by the denominator can introduce a value that makes the original denominator zero, which is undefined.",
      w:["Because rational equations always have exactly one fewer solution than they appear to.",
         "Because you are allowed to reject any solution that is negative.",
         "Because multiplying both sides by a variable is not a legal step."],
      s:["Clearing denominators is legal, but it produces an equation with a larger domain than the original.",
         "The new equation can have roots that the original never allowed — the excluded values.",
         "Those roots are <b>extraneous</b>: always substitute back or compare against the excluded values before answering."] },
    { q:"What does it mean when solving an equation leaves you with " + E("5 = 5") + "?",
      a:"The equation is an identity — every real number is a solution.",
      w:["The equation has no solution.",
         "The solution is x = 5.",
         "You made an arithmetic error, since the variable should never disappear."],
      s:["The variable cancelled and what remains is a true statement.",
         "True regardless of " + X + " means any value of " + X + " satisfies the original equation.",

  const b = R.pick(bank);
  return {
