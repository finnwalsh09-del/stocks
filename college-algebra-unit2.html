/* ============================================================
   SECTION 2.4 — Complex Numbers
   ============================================================ */
function quadH(a, b, c){
  let s = coefT(a, X + "<sup>2</sup>");
  if(b !== 0) s += pmT(b, X);
  if(c !== 0) s += pm(c);
  return s;
}
function cxH(re, im){
  if(im === 0) return nn(re);
  const a = Math.abs(im);
  const ip = (a === 1 ? "" : String(a)) + "<i>i</i>";
  if(re === 0) return (im < 0 ? MINUS : "") + ip;
  return nn(re) + (im < 0 ? " " + MINUS + " " : " + ") + ip;
}
function cxParen(re, im){ return "(" + cxH(re, im) + ")"; }
/* (rn/rd) + (iN/iD)i  as text / html */
function cxFracT(rn, rd, iN, iD){
  const rv = rn/rd, iv = iN/iD;
  const rs = frT(rn, rd), isAbs = frT(Math.abs(iN), Math.abs(iD));
  const ip = (isAbs === "1" ? "i" : isAbs + "i");
  if(Math.abs(rv) < 1e-12 && Math.abs(iv) < 1e-12) return "0";
  if(Math.abs(iv) < 1e-12) return rs;
  if(Math.abs(rv) < 1e-12) return (iv < 0 ? MINUS : "") + ip;
  return rs + (iv < 0 ? " " + MINUS + " " : " + ") + ip;
}
function cxFracH(rn, rd, iN, iD){
  const rv = rn/rd, iv = iN/iD;
  const rs = frH(rn, rd), isAbs = frH(Math.abs(iN), Math.abs(iD));
  const ip = (isAbs === "1" ? "<i>i</i>" : isAbs + "<i>i</i>");
  if(Math.abs(rv) < 1e-12 && Math.abs(iv) < 1e-12) return "0";
  if(Math.abs(iv) < 1e-12) return rs;
  if(Math.abs(rv) < 1e-12) return (iv < 0 ? MINUS : "") + ip;
  return rs + (iv < 0 ? " " + MINUS + " " : " + ") + ip;
}

T({ id:"neg-radical", sec:"2.4", name:"Square roots of negative numbers", make:function(){
  const o = R.pick([1,1,2,2,3,3,4,5,6,7]);
  const inn = R.pick([1,1,2,3,5,6,7,10,11,13,14,15,17,19,21]);
  if(o === inn) return null;
  const n = o*o*inn;
  const ansT = (inn === 1) ? nn(o) + "i" : (o === 1 ? "i√" + inn : nn(o) + "i√" + inn);
  const ansH = (inn === 1) ? nn(o) + "<i>i</i>" : (o === 1 ? "<i>i</i>" + radH(String(inn)) : nn(o) + "<i>i</i>" + radH(String(inn)));
  const wrongs = [
    { v:(inn === 1 ? nn(o) : radT(n)), why:"You dropped the <i>i</i>. The number under the radical is <em>negative</em>, so a factor of " + E("√" + MINUS + "1 = <i>i</i>") + " has to come out." },
    { v:(inn === 1 ? MINUS + nn(o) + "i" : (o === 1 ? MINUS + "i√" + inn : MINUS + nn(o) + "i√" + inn)), why:"The principal square root is the positive one — no minus sign in front." },
    { v:(inn === 1 ? nn(o*o) + "i" : nn(o*inn) + "i"), why:"When you pull a factor out of a radical you take its square root, so " + E(radH(String(o*o)) + " = " + o) + ", not " + (o*o) + "." }
  ];
  if(inn !== 1 && o !== inn) wrongs.push({ v: nn(inn) + "i√" + o, why:"The factors got swapped — the perfect square comes out, the leftover stays inside." });
  return {
    prompt:"Simplify: " + E(radH(MINUS + String(n))),
    fmt:"Write your answer in the form bi or bi√c.",
    kind:"num", ans:ansT, ansHtml:ansH, ph:"e.g. 2i√6", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "Split off the negative first: " + E(radH(MINUS + String(n)) + " = " + radH(MINUS + "1") + " · " + radH(String(n))) + " = <i>i</i>" + radH(String(n)) + ".",
      inn === 1
        ? "Now " + n + " is a perfect square: " + E(radH(String(n)) + " = " + o) + "."
        : "Now simplify " + E(radH(String(n))) + " by pulling out the largest perfect square: " + E(String(n) + " = " + (o*o) + " · " + inn) + ", so " + E(radH(String(n)) + " = " + radHtml(n)) + ".",
      "Put it together: <b>" + ansH + "</b>.",
      "Convention: write the <i>i</i> in front of the radical so it is not mistaken for part of the radicand."
    ],
    hint:"Pull out √(" + MINUS + "1) = i first, then simplify the radical that is left.",
    rule:"<b>Negative radicals:</b> " + E(radH(MINUS + "a") + " = <i>i</i>" + radH("a")) + " for a > 0. Take out the <i>i</i> before doing anything else."
  };
}});

T({ id:"complex-addsub", sec:"2.4", name:"Adding & subtracting complex numbers", make:function(){
  const a = R.nz(-9,9), b = R.nz(-9,9), c = R.nz(-9,9), d = R.nz(-9,9);
  const sub = R.chance(0.5);
  const rr = sub ? a-c : a+c, ri = sub ? b-d : b+d;
  const ansT = cxT(rr, ri);
  const wrongs = [
    { v: cxT(sub ? a-c : a+c, sub ? b+d : b-d), why:"The subtraction has to hit <em>both</em> parts of the second number — distribute the minus sign through the parentheses." },
    { v: cxT(sub ? a+c : a-c, sub ? b-d : b+d), why:"Real parts combined the wrong way. Real with real, imaginary with imaginary." },
    { v: cxT(rr + ri, 0), why:"You cannot merge the real and imaginary parts — " + E("3 + 2<i>i</i>") + " does not simplify to 5. They are unlike terms." }
  ];
  return {
    prompt:"Simplify: " + E(cxParen(a,b) + (sub ? " " + MINUS + " " : " + ") + cxParen(c,d)),
    fmt:"Write your answer in the form a + bi.",
    kind:"num", ans:ansT, ph:"a + bi", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      sub ? "Distribute the minus sign through the second parentheses — <em>both</em> parts change sign: " + E(cxParen(a,b) + " " + MINUS + " " + cxParen(c,d) + " = " + cxH(a,b) + " " + MINUS + " " + nn(c) + (d < 0 ? " + " : " " + MINUS + " ") + (Math.abs(d) === 1 ? "" : Math.abs(d)) + "<i>i</i>") + "."
          : "Drop the parentheses — addition lets you regroup freely.",
      "Combine the real parts: " + E(nn(a) + (sub ? " " + MINUS + " (" + nn(c) + ")" : " + (" + nn(c) + ")") + " = " + nn(rr)) + ".",
      "Combine the imaginary parts: " + E(nn(b) + (sub ? " " + MINUS + " (" + nn(d) + ")" : " + (" + nn(d) + ")") + " = " + nn(ri)) + ", so the <i>i</i> term is " + E(cxH(0, ri) || "0") + ".",
      "Answer: <b>" + cxH(rr, ri) + "</b>. Real and imaginary parts never mix."
    ],
    hint:"Treat i like a variable: combine like terms. Real with real, i with i.",
    rule:"<b>Adding/subtracting:</b> " + E("(a + b<i>i</i>) ± (c + d<i>i</i>) = (a ± c) + (b ± d)<i>i</i>") + ". Distribute a subtraction to both parts."
  };
}});

T({ id:"complex-mult", sec:"2.4", name:"Multiplying complex numbers", make:function(){
  const conj = R.chance(0.25);
  const a = R.nz(-7,7), b = R.nz(-7,7);
  const c = conj ? a : R.nz(-7,7), d = conj ? -b : R.nz(-7,7);
  const rr = a*c - b*d, ri = a*d + b*c;
  const ansT = cxT(rr, ri);
  const wrongs = [
    { v: cxT(a*c + b*d, ri), why:"The classic slip: " + E("<i>i</i>² = " + MINUS + "1") + ", not +1. That last product changes sign when you simplify " + E("<i>i</i>²") + "." },
    { v: cxT(a*c, b*d), why:"You multiplied straight across. Complex numbers are binomials — you have to FOIL all four products." },
    { v: cxT(rr, a*d - b*c), why:"Sign error collecting the two middle terms." }
  ];
  return {
    prompt:"Multiply and simplify: " + E(cxParen(a,b) + cxParen(c,d)),
    fmt:"Write your answer in the form a + bi.",
    kind:"num", ans:ansT, ph:"a + bi", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "FOIL, exactly like two binomials: " + E(cxParen(a,b) + cxParen(c,d) + " = " + nn(a*c) + " + " + nn(a*d) + "<i>i</i> + " + nn(b*c) + "<i>i</i> + " + nn(b*d) + "<i>i</i><sup>2</sup>") + ".",
      "Replace " + E("<i>i</i><sup>2</sup>") + " with " + E(MINUS + "1") + ": the last term " + E(nn(b*d) + "<i>i</i><sup>2</sup>") + " becomes " + E(nn(-b*d)) + ".",
      "Collect real parts: " + E(nn(a*c) + pm(-b*d) + " = " + nn(rr)) + ". Collect imaginary parts: " + E(nn(a*d) + pm(b*c) + " = " + nn(ri)) + ".",
      conj
        ? "Answer: <b>" + cxH(rr,ri) + "</b>. Notice the factors were <em>conjugates</em> — that is why the imaginary part vanished and the product is a real number."
        : "Answer: <b>" + cxH(rr,ri) + "</b>."
    ],
    hint:"FOIL it out, then replace i² with " + MINUS + "1 and combine like terms.",
    rule:"<b>Multiplying:</b> FOIL, then " + E("<i>i</i>² = " + MINUS + "1") + ". Conjugates " + E("(a + b<i>i</i>)(a " + MINUS + " b<i>i</i>) = a² + b²") + " always give a real result."
  };
}});

T({ id:"complex-div", sec:"2.4", name:"Dividing complex numbers", make:function(){
  const a = R.nz(-8,8), b = R.nz(-8,8), c = R.nz(-5,5), d = R.nz(-5,5);
  const den = c*c + d*d;
  const rn = a*c + b*d, iN = b*c - a*d;
  const ansT = cxFracT(rn, den, iN, den);
  const ansH = cxFracH(rn, den, iN, den);
  const wrongs = [
    { v: cxFracT(a*c - b*d, den, iN, den), why:"Sign slip in the numerator: multiplying by the conjugate gives " + E("<i>i</i>² = " + MINUS + "1") + ", which <em>adds</em> to the real part here." },
    { v: cxFracT(rn, den, -iN, den), why:"The imaginary part came out with the wrong sign — recheck which term you subtracted." },
    { v: cxFracT(a, c, b, d), why:"You divided the parts separately. That is not how complex division works — multiply by the conjugate of the denominator." }
  ];
  return {
    prompt:"Divide and write in standard form: " + E("<span class='fr'><span>" + cxH(a,b) + "</span><span>" + cxH(c,d) + "</span></span>"),
    fmt:"Write your answer as a + bi (fractions are fine).",
    kind:"num", ans:ansT, ansHtml:ansH, ph:"a + bi", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "You cannot leave <i>i</i> in a denominator. Multiply top and bottom by the <b>conjugate</b> of the denominator, " + E(cxH(c,-d)) + ".",
      "Denominator: " + E(cxParen(c,d) + cxParen(c,-d) + " = " + (c*c) + " + " + (d*d) + " = " + den) + " — always a positive real number.",
      "Numerator: " + E(cxParen(a,b) + cxParen(c,-d) + " = " + cxH(rn, iN)) + " after FOIL and " + E("<i>i</i>² = " + MINUS + "1") + ".",
      "Split the fraction into real and imaginary parts and reduce: <b>" + ansH + "</b>."
    ],
    hint:"Multiply the top and bottom by the conjugate of the denominator (same numbers, opposite sign on the i).",
    rule:"<b>Dividing:</b> multiply by the conjugate. " + E("(c + d<i>i</i>)(c " + MINUS + " d<i>i</i>) = c² + d²") + ", a real denominator every time."
  };
}});

T({ id:"powers-of-i", sec:"2.4", name:"Powers of i", make:function(){
  const n = R.i(5, 130);
  const r = n % 4;
  const vals = ["1", "i", MINUS + "1", MINUS + "i"];
  const ansT = vals[r];
  const wrongs = vals.filter(function(z){ return z !== ansT; }).map(function(z){
    return { v:z, why:"Powers of <i>i</i> cycle every four: " + E("<i>i</i>¹ = <i>i</i>, <i>i</i>² = " + MINUS + "1, <i>i</i>³ = " + MINUS + "<i>i</i>, <i>i</i>⁴ = 1") + ". Divide the exponent by 4 and use the remainder." };
  });
  return {
    prompt:"Simplify: " + E("<i>i</i><sup>" + n + "</sup>"),
    kind:"num", ans:ansT, ph:"1, −1, i, or −i", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "The powers of <i>i</i> repeat in a cycle of four: " + E("<i>i</i>¹ = <i>i</i>") + ", " + E("<i>i</i>² = " + MINUS + "1") + ", " + E("<i>i</i>³ = " + MINUS + "<i>i</i>") + ", " + E("<i>i</i>⁴ = 1") + ", then it starts over.",
      "Divide the exponent by 4 and keep the remainder: " + E(n + " ÷ 4 = " + Math.floor(n/4) + " remainder " + r) + ".",
      "So " + E("<i>i</i><sup>" + n + "</sup> = (<i>i</i><sup>4</sup>)<sup>" + Math.floor(n/4) + "</sup> · <i>i</i><sup>" + r + "</sup> = 1 · <i>i</i><sup>" + r + "</sup>") + ".",
      "Answer: <b>" + mt(ansT) + "</b>."
    ],
    hint:"Divide the exponent by 4. Remainder 0 → 1, 1 → i, 2 → " + MINUS + "1, 3 → " + MINUS + "i.",
    rule:"<b>Powers of i cycle by 4.</b> Only the remainder matters — " + E("<i>i</i><sup>100</sup> = 1") + " because 100 is a multiple of 4."
  };
}});

T({ id:"eval-complex", sec:"2.4", name:"Evaluating an expression at a complex number", make:function(){
  const a = R.pick([1,1,2,3]), b = R.nz(-6,6), c = R.i(-8,8);
  const p = R.nz(-4,4), q = R.nz(-4,4);
  // x = p + qi ;  x² = (p²−q²) + 2pq i
  const x2r = p*p - q*q, x2i = 2*p*q;
  const rr = a*x2r + b*p + c, ri = a*x2i + b*q;
  const ansT = cxT(rr, ri);
  const wrongs = [
    { v: cxT(a*(p*p + q*q) + b*p + c, ri), why:"When you squared " + E(cxParen(p,q)) + " you treated " + E("<i>i</i>²") + " as +1. It is " + E(MINUS + "1") + ", so that term flips sign." },
    { v: cxT(rr, a*p*q + b*q), why:"The middle term of the square is doubled: " + E("(p + q<i>i</i>)² = p² + 2pq<i>i</i> + q²<i>i</i>²") + "." },
    { v: cxT(a*x2r + b*p, ri + c), why:"The constant " + nn(c) + " is a real number — it joins the real part, not the imaginary part." }
  ];
  return {
    prompt:"Evaluate " + E(quadH(a,b,c)) + " when " + E(X + " = " + cxH(p,q)) + ".",
    fmt:"Write your answer in the form a + bi.",
    kind:"num", ans:ansT, ph:"a + bi", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "Substitute: " + E(quadH(a,b,c).replace(/<i>x<\/i>/g, cxParen(p,q))) + ".",
      "Square the complex number first: " + E(cxParen(p,q) + "<sup>2</sup> = " + (p*p) + pm(2*p*q).replace(/^ /, " ") + "<i>i</i> + " + (q*q) + "<i>i</i><sup>2</sup>") + ", and " + E("<i>i</i><sup>2</sup> = " + MINUS + "1") + ", so it equals " + E(cxH(x2r, x2i)) + ".",
      "Multiply through and add the rest: " + E(nn(a) + "(" + cxH(x2r,x2i) + ")" + (b === 0 ? "" : pmT(b, "(" + cxH(p,q) + ")")) + (c === 0 ? "" : pm(c))) + ".",
      "Collect real parts and imaginary parts separately: <b>" + cxH(rr,ri) + "</b>."
    ],
    hint:"Substitute, square carefully (the middle term doubles), replace i² with " + MINUS + "1, then collect like terms.",
    rule:"<b>Squaring:</b> " + E("(p + q<i>i</i>)² = p² " + MINUS + " q² + 2pq<i>i</i>") + ". Never square the parts separately."
  };
}});

/* ============================================================
   SECTION 2.5 — Quadratic Equations
   ============================================================ */
function rootsT(r, s){
  if(Math.abs(r - s) < 1e-12) return "x = " + nn(r);
  return "x = " + nn(r) + ", x = " + nn(s);
}
function rootsFrT(n1, d1, n2, d2){
  const a = frT(n1,d1), b = frT(n2,d2);
  if(a === b) return "x = " + a;
  return "x = " + a + ", x = " + b;
}
/* roots of (nb ± √D)/den, written the way a textbook would */
function qfDisp(nb, D, den){
  if(den < 0){ nb = -nb; den = -den; }
  if(D === 0) return "x = " + frT(nb, den);
  if(D > 0 && isSq(D)){
    const s = Math.sqrt(D);
    return rootsFrT(nb + s, den, nb - s, den);
  }
  const imag = D < 0;
  const pair = simpRad(Math.abs(D));
  const o = pair[0], inn = pair[1];
  const g = gcd(gcd(Math.abs(nb), o), den) || 1;
  const n1 = nb/g, oo = o/g, dd = den/g;
  let tok = (imag ? "i" : "") + (inn === 1 ? "" : "√" + inn);
  let coefTok = (oo === 1 && tok !== "") ? tok : String(oo) + tok;
  const body = (n1 === 0) ? "±" + coefTok : nn(n1) + " ± " + coefTok;
  return dd === 1 ? "x = " + body : "x = (" + body + ")/" + dd;
}
function discWord(D){
  if(D < 0) return "Two complex conjugate solutions (no real solutions)";
  if(D === 0) return "One repeated real solution";
  return isSq(D) ? "Two distinct rational solutions" : "Two distinct irrational solutions";
}

T({ id:"factor-a1", sec:"2.5", name:"Solving by factoring (leading coefficient 1)", make:function(){
  let r = R.nz(-9,9), s = R.i(-9,9);
  while(r === -s) s = R.i(-9,9);
  const b = -(r+s), c = r*s;
  const ansT = rootsT(r, s);
  const wrongs = [
    { v: rootsT(-r, -s), why:"Signs are flipped. From " + E("(" + X + pm(-r) + ")(" + X + pm(-s) + ") = 0") + " you set each factor to zero: " + E(X + pm(-r) + " = 0") + " gives " + E(X + " = " + nn(r)) + "." },
    { v:"x = " + nn(-b) + ", x = " + nn(c), why:"Those are numbers from the equation, not the roots. Factor first, then set each factor equal to zero." },
    { v:"x = " + nn(r), why:"A quadratic has two solutions — do not stop after the first factor." }
  ];
  return {
    prompt:"Solve by factoring: " + E(quadH(1,b,c) + " = 0"),
    fmt:"List both solutions.",
    kind:"num", ans:ansT, alt:[r === s ? nn(r) : nn(r) + ", " + nn(s)], ph:"x = , x = ", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "The equation is already set equal to zero, which is what the zero-product property needs.",
      "Find two numbers that multiply to " + nn(c) + " and add to " + nn(b) + ": that is " + nn(-r) + " and " + nn(-s) + ".",
      "Factor: " + E("(" + X + pm(-r) + ")(" + X + pm(-s) + ") = 0") + ".",
      "Zero-product property — if a product is 0, one of the factors is 0: " + E(X + pm(-r) + " = 0") + " or " + E(X + pm(-s) + " = 0") + ".",
      "Solve each: <b>" + mt(ansT) + "</b>."
    ],
    hint:"Two numbers that multiply to " + nn(c) + " and add to " + nn(b) + ". Then set each factor to zero.",
    rule:"<b>Zero-product property:</b> if " + E("AB = 0") + " then " + E("A = 0") + " or " + E("B = 0") + ". It only works when one side is <em>zero</em>."
  };
}});

T({ id:"factor-a", sec:"2.5", name:"Solving by factoring (a ≠ 1)", make:function(){
  const m = R.pick([2,2,3,3,4,5]), n = R.pick([1,1,1,2,3]);
  const p = R.nz(-6,6), q = R.nz(-6,6);
  const a = m*n, b = m*q + p*n, c = p*q;
  if(gcd(gcd(a,b), c) > 1) return null;          // keep it from reducing to an easier problem
  const r1n = -p, r1d = m, r2n = -q, r2d = n;
  if(Math.abs(r1n/r1d - r2n/r2d) < 1e-12) return null;
  const ansT = rootsFrT(r1n, r1d, r2n, r2d);
  const wrongs = [
    { v: rootsFrT(p, m, q, n), why:"Sign flip: " + E(coefT(m,X) + pm(p) + " = 0") + " gives " + E(X + " = " + frH(-p,m)) + ", the opposite sign of " + nn(p) + "." },
    { v: rootsFrT(-p, 1, -q, 1), why:"You forgot to divide by the coefficient in front of " + X + " in each factor." },
    { v: rootsFrT(-m, p || 1, -n, q || 1), why:"The fraction is upside down — solve " + E(coefT(m,X) + pm(p) + " = 0") + " step by step." }
  ];
  return {
    prompt:"Solve by factoring: " + E(quadH(a,b,c) + " = 0"),
    fmt:"List both solutions. Fractions are fine.",
    kind:"num", ans:ansT, ph:"x = , x = ", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "With a leading coefficient of " + a + ", look for factors of the form " + E("(" + coefT(m,X) + pm(p) + ")(" + coefT(n,X) + pm(q) + ")") + ".",
      "Check the middle term: " + E(nn(m) + "·" + nn(q) + " + " + nn(p) + "·" + nn(n) + " = " + nn(b)) + " ✓ and the last term " + E(nn(p) + "·" + nn(q) + " = " + nn(c)) + " ✓.",
      "So " + E("(" + coefT(m,X) + pm(p) + ")(" + coefT(n,X) + pm(q) + ") = 0") + ".",
      "Set each factor to zero: " + E(coefT(m,X) + pm(p) + " = 0") + " gives " + E(X + " = " + frH(-p,m)) + "; " + E(coefT(n,X) + pm(q) + " = 0") + " gives " + E(X + " = " + frH(-q,n)) + ".",
      "Solutions: <b>" + mt(ansT) + "</b>."
    ],
    hint:"Factor into two binomials, then set each equal to zero — remember to divide by the coefficient of x.",
    rule:"<b>When a ≠ 1:</b> the roots are usually fractions. " + E(coefT(3,X) + " " + MINUS + " 2 = 0") + " means " + E(X + " = " + frH(2,3)) + ", not " + E(X + " = 2") + "."
  };
}});

T({ id:"factor-special", sec:"2.5", name:"Special factoring forms", make:function(){
  const kind = R.pick(["dos","square","gcf"]);
  if(kind === "dos"){
    const k = R.i(2,12);
    const ansT = "x = " + k + ", x = " + MINUS + k;
    const wrongs = [
      { v:"x = " + k, why:"A difference of squares gives <em>two</em> solutions, " + E("±" + k) + " — do not lose the negative one." },
      { v:"x = " + (k*k) + ", x = " + MINUS + (k*k), why:"You forgot to take the square root: " + E(X + "² = " + (k*k)) + " means " + E(X + " = ±" + k) + "." },
      { v:"no solution", why:"This one factors as a difference of squares — real solutions do exist." }
    ];
    return {
      prompt:"Solve: " + E(X + "<sup>2</sup> " + MINUS + " " + (k*k) + " = 0"),
      fmt:"List both solutions.",
      kind:"num", ans:ansT, alt:["±" + k, k + ", -" + k], ph:"x = , x = ", wrongs:wrongs, mc:mkMC(ansT, wrongs),
      steps:[
        "Recognize the pattern " + E("a² " + MINUS + " b² = (a + b)(a " + MINUS + " b)") + " — a <b>difference of squares</b>.",
        "Here " + E(X + "² " + MINUS + " " + (k*k) + " = (" + X + " + " + k + ")(" + X + " " + MINUS + " " + k + ")") + ".",
        "Set each factor to zero: " + E(X + " = " + MINUS + k) + " or " + E(X + " = " + k) + ".",
        "Solutions: <b>" + mt(ansT) + "</b>."
      ],
      hint:"Difference of squares: a² " + MINUS + " b² = (a + b)(a " + MINUS + " b).",
      rule:"<b>Difference of squares</b> factors. A <em>sum</em> of squares, " + E(X + "² + " + (k*k)) + ", does not factor over the reals — it gives complex roots."
    };
  }
  if(kind === "square"){
    const h = R.nz(-8,8);
    const ansT = "x = " + nn(-h);
    const wrongs = [
      { v:"x = " + nn(h), why:"Sign flip: " + E("(" + X + pm(h) + ")² = 0") + " means " + E(X + pm(h) + " = 0") + ", so " + E(X + " = " + nn(-h)) + "." },
      { v:"x = " + nn(-h) + ", x = " + nn(h), why:"Both factors are identical here, so there is only one distinct solution — a repeated root." },
      { v:"x = " + nn(h*h), why:"That is the constant term, not a solution." }
    ];
    return {
      prompt:"Solve: " + E(quadH(1, 2*h, h*h) + " = 0"),
      fmt:"Give every distinct solution.",
      kind:"num", ans:ansT, ph:"x = ", wrongs:wrongs, mc:mkMC(ansT, wrongs),
      steps:[
        "Check for a perfect square trinomial: is the last term the square of half the middle coefficient? Half of " + nn(2*h) + " is " + nn(h) + ", and " + E(nn(h) + "² = " + (h*h)) + " ✓.",
        "So it factors as " + E("(" + X + pm(h) + ")<sup>2</sup> = 0") + ".",
        "Both factors are the same, so " + E(X + pm(h) + " = 0") + " and " + E(X + " = " + nn(-h)) + ".",
        "This is a <b>repeated (double) root</b>: one distinct solution, " + mt(ansT) + ". Its discriminant is 0."
      ],
      hint:"Is this a perfect square trinomial? Half the middle coefficient, squared, should equal the last term.",
      rule:"<b>Perfect square trinomial:</b> " + E("a² ± 2ab + b² = (a ± b)²") + ". It produces one repeated root, not two."
    };
  }
  const a = R.pick([1,2,3,4]), b = R.nz(-9,9);
  const ansT = "x = 0, x = " + frT(-b, a);
  const wrongs = [
    { v:"x = " + frT(-b, a), why:"You divided both sides by " + X + ". Never do that — it deletes the solution " + E(X + " = 0") + ". Factor out the " + X + " instead." },
    { v:"x = 0, x = " + frT(b, a), why:"Sign slip: " + E(coefT(a,X) + pm(b) + " = 0") + " gives " + E(X + " = " + frH(-b,a)) + "." },
    { v:"x = 0", why:"There are two solutions — the second factor gives one too." }
  ];
  return {
    prompt:"Solve: " + E(coefT(a, X + "<sup>2</sup>") + pmT(b, X) + " = 0"),
    fmt:"List both solutions.",
    kind:"num", ans:ansT, ph:"x = , x = ", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "There is no constant term, so factor out the greatest common factor, " + E(X) + ": " + E(X + "(" + coefT(a,X) + pm(b) + ") = 0") + ".",
      "Zero-product property: " + E(X + " = 0") + " or " + E(coefT(a,X) + pm(b) + " = 0") + ".",
      "The second factor gives " + E(X + " = " + frH(-b,a)) + ".",
      "Solutions: <b>" + mt(ansT) + "</b>. Note that " + E(X + " = 0") + " is a real solution — dividing both sides by " + X + " at the start would have destroyed it."
    ],
    hint:"No constant term means you can factor out an x. Do not divide by x.",
    rule:"<b>Never divide by the variable.</b> Factoring keeps every solution; dividing throws one away."
  };
}});

T({ id:"not-standard", sec:"2.5", name:"Rearranging before factoring", make:function(){
  const r = R.nz(-7,7);
  let s = R.i(-7,7);
  while(s === r) s = R.i(-7,7);
  const a = R.nz(-6,6);
  const b = -(r+s) - a;
  const k = a*b - r*s;
  if(k === 0) return null;
  const ansT = rootsT(r, s);
  const wrongs = [
    { v:"x = " + nn(-a) + ", x = " + nn(-b), why:"You set each factor equal to " + nn(k) + " — or to zero without moving " + nn(k) + " across first. The zero-product property only works when one side is <em>zero</em>." },
    { v: rootsT(-r, -s), why:"Signs flipped when you read the roots off the factors." },
    { v:"x = " + nn(r), why:"There are two solutions here." }
  ];
  return {
    prompt:"Solve: " + E("(" + X + pm(a) + ")(" + X + pm(b) + ") = " + nn(k)),
    fmt:"List both solutions.",
    kind:"num", ans:ansT, ph:"x = , x = ", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "The right side is not zero, so you <em>cannot</em> set each factor equal to " + nn(k) + ". Expand first.",
      "Multiply out the left side: " + E(X + "<sup>2</sup>" + pmT(a+b, X) + pm(a*b)) + ".",
      "Move " + nn(k) + " across so one side is zero: " + E(quadH(1, a+b, a*b - k) + " = 0") + ".",
      "Now factor: " + E("(" + X + pm(-r) + ")(" + X + pm(-s) + ") = 0") + ".",
      "Set each factor to zero: <b>" + mt(ansT) + "</b>."
    ],
    hint:"Expand, then move everything to one side so it equals zero — only then can you factor and split.",
    rule:"<b>Standard form first:</b> " + E("ax² + bx + c = 0") + ". A product equal to anything other than zero tells you nothing about the factors."
  };
}});

T({ id:"square-root-prop", sec:"2.5", name:"The square root property", make:function(){
  const h = R.i(-8,8);
  const mode = R.pick(["perfect","irrational","complex","scaled"]);
  let coefA = 1, k;
  if(mode === "perfect") k = R.pick([1,4,9,16,25,36,49,64]);
  else if(mode === "irrational") k = R.pick([2,3,5,7,8,12,18,20,24,27,32,45,50]);
  else if(mode === "complex") k = -R.pick([1,4,9,16,25,2,3,5,8,12,18]);
  else { coefA = R.pick([2,3,4,5]); k = coefA * R.pick([4,9,16,25,2,3,5,8,12]); }
  const kk = k / coefA;
  const ansT = qfDisp(2*h, 4*kk, 2);   // roots h ± √kk  ==  (2h ± √(4kk))/2
  const single = (kk >= 0 && isSq(kk))
    ? "x = " + nn(h + Math.sqrt(kk))
    : (kk > 0 ? "x = " + nn(h) + " + " + radT(kk)
              : "x = " + nn(h) + " + " + (radT(-kk) === "1" ? "i" : radT(-kk) + "i"));
  const wrongs = [
    { v: single, why:"You lost the ±. Taking the square root of both sides gives <em>two</em> answers, one from +" + radH("k") + " and one from " + MINUS + radH("k") + "." },
    { v: qfDisp(-2*h, 4*kk, 2), why:"Sign slip isolating " + X + ": from " + E(X + pm(-h) + " = ±…") + " you <em>add</em> " + nn(h) + " to both sides." },
    { v: qfDisp(2*h, kk, 2), why:"Check the arithmetic under the radical — take the square root of " + nn(kk) + " itself, not of a scaled version of it." }
  ];
  return {
    prompt:"Solve using the square root property: " + E((coefA === 1 ? "" : nn(coefA)) + "(" + X + pm(-h) + ")<sup>2</sup> = " + nn(k)),
    fmt:"Give both solutions in exact form.",
    kind:"num", ans:ansT, ph:"x = ", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      coefA === 1
        ? "The squared binomial is already isolated."
        : "Divide both sides by " + nn(coefA) + " first to isolate the square: " + E("(" + X + pm(-h) + ")<sup>2</sup> = " + nn(kk)) + ".",
      "Square root property: if " + E("u² = c") + " then " + E("u = ±" + radH("c")) + ". Take the square root of both sides and keep the <b>±</b>: " + E(X + pm(-h) + " = ±" + radH(nn(kk))) + ".",
      kk < 0
        ? "The radicand is negative, so the roots are complex: " + E("±" + radH(nn(kk)) + " = ±" + mt(radT(-kk) === "1" ? "i" : radT(-kk) + "i")) + "."
        : (isSq(kk) ? "Simplify: " + E(radH(String(kk)) + " = " + Math.sqrt(kk)) + "."
                    : (simpRad(kk)[0] > 1 ? "Simplify the radical: " + E(radH(String(kk)) + " = " + radHtml(kk)) + "."
                                            : E(radH(String(kk))) + " has no perfect-square factors, so it is already in simplest form.")),
      "" + (h < 0 ? "Subtract " + Math.abs(h) : "Add " + h) + " on both sides to isolate " + X + ": <b>" + mt(ansT) + "</b>."
    ],
    hint:"Isolate the squared binomial, take the square root of both sides, and do not forget the ±.",
    rule:"<b>Square root property:</b> " + E("(x " + MINUS + " h)² = k") + " gives " + E("x = h ± " + radH("k")) + ". A negative k gives two complex solutions — never \"no solution\" in this course."
  };
}});

T({ id:"complete-square", sec:"2.5", name:"Completing the square", make:function(){
  const findTerm = R.chance(0.35);
  const b = 2*R.nz(-7,7);
  const half = b/2, sq = half*half;
  if(findTerm){
    const ansT = String(sq);
    const wrongs = [
      { v: String(b*b), why:"Square <em>half</em> of the middle coefficient: " + E("(" + nn(b) + "/2)² = " + sq) + ", not " + nn(b) + "²." },
      { v: nn(half), why:"That is half the coefficient — you still have to square it." },
      { v: String(sq*4), why:"You squared the whole coefficient instead of half of it." }
    ];
    return {
      prompt:"What number must be added to " + E(X + "<sup>2</sup>" + pmT(b, X)) + " to make it a perfect square trinomial?",
      kind:"num", ans:ansT, ph:"a number", wrongs:wrongs, mc:mkMC(ansT, wrongs),
      steps:[
        "Take half of the coefficient of " + X + ": " + E(nn(b) + " ÷ 2 = " + nn(half)) + ".",
        "Square it: " + E("(" + nn(half) + ")<sup>2</sup> = " + sq) + ".",
        "Adding " + sq + " gives " + E(X + "<sup>2</sup>" + pmT(b,X) + " + " + sq + " = (" + X + pm(half) + ")<sup>2</sup>") + ".",
        "Answer: <b>" + sq + "</b>."
      ],
      hint:"Half the middle coefficient, then square it.",
      rule:"<b>Completing the square:</b> add " + E("(b/2)²") + ". The factored form is always " + E("(x + b/2)²") + "."
    };
  }
  const c = R.i(-20,20);
  const D = b*b - 4*c;
  if(D === 0) return null;
  const ansT = qfDisp(-b, D, 2);
  const wrongs = [
    { v: qfDisp(b, D, 2), why:"Sign error in the final step: from " + E("(" + X + pm(half) + ")² = " + nn(sq - c)) + " you subtract " + nn(half) + ", giving " + E(X + " = " + nn(-half) + " ± …") + "." },
    { v: qfDisp(-b, b*b + 4*c, 2), why:"When you moved " + nn(c) + " to the right side its sign had to change before you added " + sq + "." },
    { v: qfDisp(-b, D, 1), why:"Check the last division — the halving comes from taking half the middle coefficient, once." }
  ];
  return {
    prompt:"Solve by completing the square: " + E(quadH(1, b, c) + " = 0"),
    fmt:"Give both solutions in exact form.",
    kind:"num", ans:ansT, ph:"x = ", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "Move the constant to the right side: " + E(X + "<sup>2</sup>" + pmT(b,X) + " = " + nn(-c)) + ".",
      "Take half the coefficient of " + X + " and square it: " + E("(" + nn(b) + "/2)<sup>2</sup> = (" + nn(half) + ")<sup>2</sup> = " + sq) + ".",
      "Add " + sq + " to <em>both</em> sides: " + E(X + "<sup>2</sup>" + pmT(b,X) + " + " + sq + " = " + nn(-c) + " + " + sq + " = " + nn(sq - c)) + ".",
      "The left side is now a perfect square: " + E("(" + X + pm(half) + ")<sup>2</sup> = " + nn(sq - c)) + ".",
      "Square root property (keep the ±), then " + (half < 0 ? "add " + Math.abs(half) : "subtract " + half) + " on both sides: <b>" + mt(ansT) + "</b>."
    ],
    hint:"Constant to the right, add (b/2)² to both sides, factor the left as a square, then square-root both sides with a ±.",
    rule:"<b>Completing the square</b> works on any quadratic — and it is where the quadratic formula comes from."
  };
}});

T({ id:"quad-formula", sec:"2.5", name:"The quadratic formula", make:function(){
  const a = R.pick([1,1,1,2,2,3]), b = R.nz(-9,9), c = R.nz(-9,9);
  const D = b*b - 4*a*c;
  if(D === 0) return null;
  const rounded = D > 0 && !isSq(D) && R.chance(0.3);
  const exact = qfDisp(-b, D, 2*a);
  let ansT = exact, alt = [], tol = 1e-6, fmt = "Give exact solutions in simplest form.";
  if(rounded){
    const r1 = (-b + Math.sqrt(D))/(2*a), r2 = (-b - Math.sqrt(D))/(2*a);
    ansT = r1.toFixed(2) + ", " + r2.toFixed(2);
    alt = [exact];
    tol = 0.0051;
    fmt = "Round each solution to two decimal places.";
  } else if(D > 0 && !isSq(D)){
    const r1 = (-b + Math.sqrt(D))/(2*a), r2 = (-b - Math.sqrt(D))/(2*a);
    alt = [r1.toFixed(2) + ", " + r2.toFixed(2)];
    tol = 0.0051;
    fmt = "Exact simplified form, or decimals rounded to two places.";
  }
  const wrongs = [
    { v: qfDisp(b, D, 2*a), why:"The formula starts with " + E(MINUS + "b") + ", so with b = " + nn(b) + " that term is " + nn(-b) + "." },
    { v: qfDisp(-b, b*b + 4*a*c, 2*a), why:"The discriminant is " + E("b² " + MINUS + " 4ac") + " — a subtraction. You added." },
    { v: qfDisp(-b, D, a), why:"The whole numerator sits over " + E("2a") + ", not " + E("a") + "." }
  ];
  return {
    prompt:"Solve using the quadratic formula: " + E(quadH(a,b,c) + " = 0"),
    fmt:fmt,
    kind:"num", ans:ansT, alt:alt, tol:tol, ph:"x = ", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "Identify the coefficients: " + E("a = " + a) + ", " + E("b = " + nn(b)) + ", " + E("c = " + nn(c)) + ".",
      "Quadratic formula: " + E("x = (" + MINUS + "b ± " + radH("b² " + MINUS + " 4ac") + ")/2a") + ".",
      "Discriminant: " + E("b² " + MINUS + " 4ac = (" + nn(b) + ")² " + MINUS + " 4(" + a + ")(" + nn(c) + ") = " + nn(D)) + ", so there are " + discWord(D).toLowerCase() + ".",
      "Substitute: " + E("x = (" + nn(-b) + " ± " + radH(nn(D)) + ")/" + (2*a)) + ".",
      (D < 0 ? "The radicand is negative, so factor out an <i>i</i>: " + E(radH(nn(D)) + " = " + mt(radT(-D) === "1" ? "i" : radT(-D) + "i")) + ". "
             : (isSq(D) ? "Simplify: " + E(radH(String(D)) + " = " + Math.sqrt(D)) + ". "
                        : (simpRad(D)[0] > 1 ? "Simplify the radical: " + E(radH(String(D)) + " = " + radHtml(D)) + ". "
                                             : E(radH(String(D))) + " is already in simplest form. "))) +
        "Reduce the fraction. Answer: <b>" + mt(ansT) + "</b>."
    ],
    hint:"Write down a, b, c first. Then " + E("x = (" + MINUS + "b ± √(b² " + MINUS + " 4ac))/2a") + " — the whole top divides by 2a.",
    rule:"<b>Quadratic formula</b> works on every quadratic. Compute the discriminant first: it tells you what kind of answer to expect."
  };
}});

T({ id:"discriminant", sec:"2.5", name:"The discriminant", make:function(){
  const a = R.pick([1,1,2,3]), b = R.nz(-9,9), c = R.nz(-9,9);
  const D = b*b - 4*a*c;
  const ans = discWord(D);
  const all = ["Two distinct rational solutions","Two distinct irrational solutions","One repeated real solution","Two complex conjugate solutions (no real solutions)"];
  const wrongs = all.filter(function(z){ return z !== ans; }).map(function(z){
    return { v:z, why:"Compute " + E("b² " + MINUS + " 4ac") + " and read it: negative → two complex; zero → one repeated; positive perfect square → two rational; positive non-square → two irrational." };
  });
  return {
    prompt:"Use the discriminant to describe the number and type of solutions of " + E(quadH(a,b,c) + " = 0") + ".",
    kind:"mc", ans:ans, mc:mkMC(ans, wrongs),
    steps:[
      "The discriminant is the expression under the radical in the quadratic formula: " + E("b² " + MINUS + " 4ac") + ".",
      "With " + E("a = " + a) + ", " + E("b = " + nn(b)) + ", " + E("c = " + nn(c)) + ": " + E("(" + nn(b) + ")² " + MINUS + " 4(" + a + ")(" + nn(c) + ") = " + (b*b) + " " + MINUS + " " + (4*a*c) + " = " + nn(D)) + ".",
      D < 0 ? "It is negative, so the square root is imaginary — the two solutions are complex conjugates and the parabola never crosses the x-axis."
        : D === 0 ? "It is exactly zero, so the ± adds nothing — there is one repeated real solution and the parabola touches the x-axis once."
        : isSq(D) ? "It is positive and a perfect square (" + D + " = " + Math.sqrt(D) + "²), so the radical is a whole number — two rational solutions, and the quadratic factors."
        : "It is positive but not a perfect square, so the radical stays irrational — two distinct irrational solutions.",
      "Answer: <b>" + ans + "</b>."
    ],
    hint:"Compute b² " + MINUS + " 4ac and look at its sign — and, if positive, whether it is a perfect square.",
    rule:"<b>Discriminant " + E("b² " + MINUS + " 4ac") + ":</b> negative → 2 complex · zero → 1 repeated · positive perfect square → 2 rational · positive non-square → 2 irrational."
  };
}});

T({ id:"quad-application", sec:"2.5", name:"Quadratic word problems", make:function(){
  if(R.chance(0.5)){
    const w = R.i(3,14), k = R.i(1,9);
    const area = w*(w+k);
    const ansT = String(w);
    const wrongs = [
      { v:nn(w+k), why:"That is the length. The question asks for the width — the smaller dimension you called " + E(X) + "." },
      { v:nn(-(w+k)), why:"A negative width is impossible, so that root of the quadratic gets discarded." },
      { v:nn(Math.round(area/2)), why:"Half the area is not a side length. Set up " + E("w(w + " + k + ") = " + area) + " and solve the quadratic." }
    ];
    return {
      prompt:"The length of a rectangle is " + k + " " + (k === 1 ? "foot" : "feet") + " more than its width, and its area is " + area + " square feet. Find the <b>width</b>.",
      fmt:"Give the width in feet.",
      kind:"num", ans:ansT, ph:"a number", wrongs:wrongs, mc:mkMC(ansT, wrongs),
      steps:[
        "Let " + E(X) + " be the width. Then the length is " + E(X + " + " + k) + ".",
        "Area = length × width: " + E(X + "(" + X + " + " + k + ") = " + area) + ".",
        "Expand and set equal to zero: " + E(quadH(1, k, -area) + " = 0") + ".",
        "Factor: " + E("(" + X + " " + MINUS + " " + w + ")(" + X + " + " + (w+k) + ") = 0") + ", so " + E(X + " = " + w) + " or " + E(X + " = " + MINUS + (w+k)) + ".",
        "A width cannot be negative, so discard " + E(X + " = " + MINUS + (w+k)) + ". The width is <b>" + w + " feet</b> (and the length is " + (w+k) + " feet — check: " + w + " × " + (w+k) + " = " + area + " ✓)."
      ],
      hint:"Let x be the width, write the length in terms of x, then use Area = length × width.",
      rule:"<b>Word problems:</b> a quadratic gives two roots, but lengths, times and counts cannot be negative — always discard the impossible one."
    };
  }
  const trip = R.pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25],[6,8,10],[9,12,15],[20,21,29]]);
  const aLeg = trip[0], bLeg = trip[1], hyp = trip[2], k = bLeg - aLeg;
  const ansT = String(aLeg);
  const wrongs = [
    { v:nn(bLeg), why:"That is the longer leg. The question asks for the shorter one, which you set as " + E(X) + "." },
    { v:nn(hyp - k), why:"You cannot just subtract along a triangle — the Pythagorean theorem relates the <em>squares</em> of the sides." },
    { v:nn(-(aLeg + k)), why:"Negative lengths are discarded; keep the positive root only." }
  ];
  return {
    prompt:"The longer leg of a right triangle is " + k + " " + (k === 1 ? "inch" : "inches") + " longer than the shorter leg, and the hypotenuse is " + hyp + " inches. Find the <b>shorter leg</b>.",
    fmt:"Give the length in inches.",
    kind:"num", ans:ansT, ph:"a number", wrongs:wrongs, mc:mkMC(ansT, wrongs),
    steps:[
      "Let " + E(X) + " be the shorter leg; the longer leg is " + E(X + " + " + k) + " and the hypotenuse is " + hyp + ".",
      "Pythagorean theorem: " + E(X + "<sup>2</sup> + (" + X + " + " + k + ")<sup>2</sup> = " + hyp + "<sup>2</sup>") + ".",
      "Expand: " + E(X + "<sup>2</sup> + " + X + "<sup>2</sup> + " + (2*k) + X + " + " + (k*k) + " = " + (hyp*hyp)) + ", so " + E("2" + X + "<sup>2</sup> + " + (2*k) + X + " " + MINUS + " " + (hyp*hyp - k*k) + " = 0") + ".",
      "Divide by 2 and solve: the roots are " + E(X + " = " + aLeg) + " and a negative value.",
      "Lengths are positive, so the shorter leg is <b>" + aLeg + " inches</b> (check: " + aLeg + "² + " + bLeg + "² = " + (aLeg*aLeg) + " + " + (bLeg*bLeg) + " = " + (hyp*hyp) + " = " + hyp + "² ✓)."
    ],
    hint:"Name the shorter leg x, write the other leg in terms of x, then use a² + b² = c².",
    rule:"<b>Pythagorean theorem:</b> " + E("a² + b² = c²") + ", with c the hypotenuse. Always check the answer back in the triangle."
  };
}});

T({ id:"concept-25", sec:"2.5", name:"Quadratic concepts", make:function(){
  const bank = [
    { q:"When solving a quadratic by factoring, why must all terms be moved to one side so the other side is zero?",
      a:"Because the zero-product property only applies when a product equals zero.",
      w:["Because a quadratic must always have its constant term on the right.",
         "Because otherwise the equation is not really quadratic.",
         "Because factoring is impossible when the leading coefficient is not 1."],
      s:["The zero-product property says: if " + E("AB = 0") + " then " + E("A = 0") + " or " + E("B = 0") + ".",
         "There is no equivalent rule for " + E("AB = 6") + " — many pairs multiply to 6, so you learn nothing about the factors.",
         "That is why standard form " + E("ax² + bx + c = 0") + " comes first."] },
    { q:"In the quadratic formula, what is the expression " + E("b² " + MINUS + " 4ac") + " called, and what does it tell you?",
      a:"The discriminant — its sign tells you how many real solutions there are and whether they are rational, irrational, or complex.",
      w:["The determinant — it tells you whether the parabola opens up or down.",
         "The vertex — it gives the turning point of the parabola.",
         "The coefficient — it tells you how wide the parabola is."],
      s:["It is the part under the radical, called the <b>discriminant</b>.",
         "Negative → two complex conjugate solutions. Zero → one repeated solution. Positive → two real solutions.",
         "If it is a positive perfect square the solutions are rational (so the quadratic factors); otherwise they are irrational."] },
    { q:"When we solve a quadratic equation, how many solutions should we always start out seeking?",
      a:"Two — a second-degree equation has two solutions, though they may be repeated or complex.",
      w:["One, since most quadratics have a single answer.",
         "Two, but only when the parabola crosses the x-axis twice.",
         "As many as the degree of the constant term."],
      s:["The degree of the polynomial tells you how many roots to expect, counting repeats.",
         "A quadratic is degree 2, so look for two solutions every time.",
         "They may coincide (a repeated root) or be complex — but stopping at one solution is the most common way to lose points."] },
    { q:"When is the square root property the most efficient method?",
      a:"When the equation has no plain x term — a perfect square (or an x² term) is already isolated.",
      w:["Whenever the leading coefficient is 1.",
         "Whenever the discriminant is a perfect square.",
         "Whenever the equation has a negative constant term."],
      s:["Equations like " + E(X + "² = 49") + " or " + E("(" + X + " " + MINUS + " 3)² = 20") + " have no separate " + X + " term to worry about.",
         "You can take the square root of both sides directly — remembering the ±.",
         "If a middle " + X + " term is present, factor, complete the square, or use the formula instead."] },
    { q:"A quadratic equation has a discriminant of 0. What does its graph look like?",
      a:"The parabola touches the x-axis at exactly one point — its vertex sits on the axis.",
      w:["The parabola crosses the x-axis at two separate points.",
         "The parabola never touches the x-axis.",
         "The graph is a straight line rather than a parabola."],
      s:["The solutions of " + E("ax² + bx + c = 0") + " are the x-intercepts of " + E(Y + " = ax² + bx + c") + ".",
         "A discriminant of 0 means one repeated solution, so there is exactly one x-intercept.",
         "The vertex lands right on the x-axis."] }
  ];
  const b = R.pick(bank);
  return {
    prompt:b.q, kind:"mc", ans:b.a,
    mc:mkMC(b.a, b.w.map(function(z){ return { v:z, why:null }; })), steps:b.s,
    hint:"These are the verbal questions from 2.5 — the answers are in the section headings.",
    rule:"<b>Know the vocabulary:</b> standard form, zero-product property, discriminant, repeated root. Tests ask about them directly."
  };
}});

function refCard(){
  const wrap = document.createElement("div");
  wrap.className = "stack";
  const mkCard = function(sec, title, rows, traps){
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = '<div class="eyebrow">' + sec + "</div><h2>" + title + "</h2>";
    const g = document.createElement("div");
    g.className = "refgrid";
    g.style.marginTop = "12px";
    const f = document.createElement("div");
    rows.forEach(function(r){
      f.innerHTML += '<div class="formula">' + r[0] + "<em>" + r[1] + "</em></div>";
    });
    g.appendChild(f);
    const t = document.createElement("div");
    traps.forEach(function(r){
      t.innerHTML += '<div class="trap"><span class="x">✗</span><span>' + r + "</span></div>";
    });
    g.appendChild(t);
    c.appendChild(g);
    return c;
  };
  const head = document.createElement("div");
  head.className = "hero";
  head.innerHTML = '<div class="eyebrow">Reference</div><h1 style="font-size:26px;margin:4px 0 6px">Everything on the Unit 2 test</h1>' +
    '<p class="muted">Formulas on the left, the mistakes that cost the most points on the right. Read it once tonight and once in the morning.</p>';
  wrap.appendChild(head);

  wrap.appendChild(mkCard("2.1", "Coordinates & Graphs", [
    ["d = " + radH("(x₂ " + MINUS + " x₁)² + (y₂ " + MINUS + " y₁)²"), "Distance between two points"],
    ["M = ((x₁ + x₂)/2, (y₁ + y₂)/2)", "Midpoint — average each coordinate"],
    [X + "-intercept: set " + Y + " = 0 → (a, 0)", "Where the graph crosses the x-axis"],
    [Y + "-intercept: set " + X + " = 0 → (0, b)", "Where the graph crosses the y-axis"],
    ["I (+,+) · II (" + MINUS + ",+) · III (" + MINUS + "," + MINUS + ") · IV (+," + MINUS + ")", "Quadrants, counter-clockwise from upper right"]
  ], [
    "Squaring before subtracting in the distance formula.",
    "Subtracting instead of averaging in the midpoint formula.",
    "Writing an intercept as a single number when the question wants a point.",
    "Calling a point on an axis \"Quadrant I\" — axis points are in no quadrant.",
    "Mixing up which coordinate is which: it is always (x, y), run then rise."
  ]));

  wrap.appendChild(mkCard("2.2", "Linear Equations", [
    ["m = (y₂ " + MINUS + " y₁)/(x₂ " + MINUS + " x₁)", "Slope — rise over run"],
    [Y + " " + MINUS + " y₁ = m(" + X + " " + MINUS + " x₁)", "Point-slope form"],
    [Y + " = m" + X + " + b", "Slope-intercept form"],
    ["m₁ = m₂", "Parallel lines"],
    ["m₁ · m₂ = " + MINUS + "1", "Perpendicular — flip and negate"],
    [Y + " = c horizontal (m = 0) · " + X + " = c vertical (m undefined)", "The two special lines"]
  ], [
    "Multiplying only some terms by the LCD when clearing fractions.",
    "Forgetting to check a rational equation's answer against the excluded values.",
    "Reporting an extraneous solution instead of \"no solution\".",
    "Saying a vertical line has slope 0 — it is undefined; the horizontal one is 0.",
    "Using the same slope for a perpendicular line instead of the negative reciprocal.",
    "Losing the sign when distributing a minus over parentheses."
  ]));

  wrap.appendChild(mkCard("2.4", "Complex Numbers", [
    ["<i>i</i> = " + radH(MINUS + "1") + " , <i>i</i>² = " + MINUS + "1", "The definition everything follows from"],
    [radH(MINUS + "a") + " = <i>i</i>" + radH("a"), "Pull out the i first, then simplify"],
    ["(a + b<i>i</i>) ± (c + d<i>i</i>) = (a ± c) + (b ± d)<i>i</i>", "Add/subtract like terms"],
    ["(a + b<i>i</i>)(c + d<i>i</i>) → FOIL, then <i>i</i>² = " + MINUS + "1", "Multiplying"],
    ["Multiply by the conjugate " + E("c " + MINUS + " d<i>i</i>"), "Dividing — clears i from the denominator"],
    ["<i>i</i>¹ = <i>i</i> · <i>i</i>² = " + MINUS + "1 · <i>i</i>³ = " + MINUS + "<i>i</i> · <i>i</i>⁴ = 1", "Cycle of four — divide the exponent by 4"]
  ], [
    "Treating <i>i</i>² as +1 — it is " + MINUS + "1, and it flips the sign of that term.",
    "Dropping the <i>i</i> when simplifying " + radH(MINUS + "48") + ".",
    "Squaring (p + q<i>i</i>) part by part and forgetting the doubled middle term.",
    "Leaving <i>i</i> in a denominator instead of multiplying by the conjugate.",
    "Combining a real and an imaginary part into one number — they are unlike terms."
  ]));

  wrap.appendChild(mkCard("2.5", "Quadratic Equations", [
    ["a" + X + "² + b" + X + " + c = 0", "Standard form — required before factoring"],
    ["AB = 0 → A = 0 or B = 0", "Zero-product property"],
    ["(" + X + " " + MINUS + " h)² = k → " + X + " = h ± " + radH("k"), "Square root property (keep the ±)"],
    ["Add (b/2)² to both sides", "Completing the square"],
    [X + " = (" + MINUS + "b ± " + radH("b² " + MINUS + " 4ac") + ")/2a", "Quadratic formula — works every time"],
    ["b² " + MINUS + " 4ac", "Discriminant: " + MINUS + " → 2 complex, 0 → 1 repeated, + square → 2 rational, + non-square → 2 irrational"]
  ], [
    "Setting factors equal to a non-zero number — expand and move everything to one side first.",
    "Dividing both sides by " + X + " and losing the solution " + X + " = 0.",
    "Forgetting the ± after taking a square root.",
    "Writing " + MINUS + "b as b in the formula when b is already negative.",
    "Putting only part of the numerator over 2a.",
    "Reporting a negative length or time in a word problem instead of discarding it."
  ]));

  const last = document.createElement("div");
  last.className = "card";
  last.innerHTML = '<div class="eyebrow">Test-day order of operations</div><h2>How to attack each problem</h2>' +
    '<div class="steps" style="border-top:0;padding-top:8px"><ol>' +
    "<li>Read what is actually being asked — the width, not the length; the x-intercept, not the y.</li>" +
    "<li>Name the type: linear, rational, complex arithmetic, or quadratic. That picks the method.</li>" +
    "<li>For quadratics, check the discriminant early so you know what kind of answer to expect.</li>" +
    "<li>Work in exact form; round only at the very end, and only if the problem says to.</li>" +
    "<li>Check: substitute back, reject extraneous roots and impossible lengths, count your solutions.</li>" +
    "<li>Answer in the form requested — a point, an equation, a + b<i>i</i>, or a labeled number.</li>" +
    "</ol></div>";
  wrap.appendChild(last);
  return wrap;
}

/* ============================================================
   6. persistent progress
   ============================================================ */
const KEY = "ca-unit2-v1";
let store = { topics:{}, sessions:[], plan:{}, testAt:null, theme:null, seen:0 };
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p && typeof p === "object"){
        store = Object.assign(store, p);
        store.topics = store.topics || {};
        store.sessions = store.sessions || [];
        store.plan = store.plan || {};
      }
    }
  } catch(e){ /* private mode: run without persistence */ }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){}
}
function rec(id){
  if(!store.topics[id]) store.topics[id] = { a:0, c:0, asst:0, miss:0 };
  return store.topics[id];
}
function mastery(id){
  const t = store.topics[id];
  if(!t || !t.a) return null;
  return (t.c - 0.5*t.asst) / t.a;
}
function sectionReadiness(sec){
  const ids = TOPICS.filter(function(t){ return t.sec === sec; }).map(function(t){ return t.id; });
  let a = 0, c = 0;
  ids.forEach(function(id){
    const t = store.topics[id];
    if(t){ a += t.a; c += Math.max(0, t.c - 0.5*t.asst); }
  });
  if(!a) return { pct:null, n:0 };
  const covered = ids.filter(function(id){ return store.topics[id] && store.topics[id].a > 0; }).length;
  const breadth = clamp(covered / Math.max(1, ids.length) * 1.15, 0, 1);
  return { pct: Math.round((c/a) * 100 * (0.55 + 0.45*breadth)), n:a };
}
function overallReady(){
  let sum = 0, n = 0;
  SECTIONS.forEach(function(s){
    const r = sectionReadiness(s.id);
    if(r.pct !== null){ sum += r.pct; n++; }
  });
  if(!n) return null;
  return Math.round(sum / SECTIONS.length);   // untouched sections count as 0
}
function weakList(){
  const out = TOPICS.map(function(t){
    const r = store.topics[t.id];
    const a = r ? r.a : 0;
    const m = mastery(t.id);
    // unseen topics rank as "unknown" and get priority just below outright failures
    const score = (m === null) ? 0.35 : m;
    return { t:t, a:a, m:m, score:score, miss:(r ? r.miss : 0) };
  });
  out.sort(function(p,q){
    if(p.score !== q.score) return p.score - q.score;
    return q.miss - p.miss;
  });
  return out;
}

/* ============================================================
   7. session engine
   ============================================================ */
let S = null;      // active session
let tickHandle = null;

function poolFor(secs){
  return TOPICS.filter(function(t){ return secs.indexOf(t.sec) >= 0; });
}
function pickWeighted(pool, n, smart){
  const chosen = [];
  const lastTwo = [];
  const weightOf = function(t){
    if(!smart) return 1;
    const m = mastery(t.id);
    const r = store.topics[t.id];
    let w = (m === null) ? 2.2 : (1 + 2.6*(1 - clamp(m,0,1)));
    if(r && r.miss > 0) w += 1.2 * Math.min(3, r.miss);
    return w;
  };
  for(let k = 0; k < n; k++){
    const cands = pool.filter(function(t){ return lastTwo.indexOf(t.id) < 0; });
    const use = cands.length ? cands : pool;
    let total = 0;
    const ws = use.map(function(t){ const w = weightOf(t); total += w; return w; });
    let roll = Math.random() * total, pickIdx = 0;
    for(let j = 0; j < use.length; j++){ roll -= ws[j]; if(roll <= 0){ pickIdx = j; break; } }
    const t = use[pickIdx];
    chosen.push(t);
    lastTwo.push(t.id);
    if(lastTwo.length > 2) lastTwo.shift();
  }
  return chosen;
}
function buildQuestion(topic){
  let q = null;
  for(let attempt = 0; attempt < 12 && !q; attempt++){
    try { q = topic.make(); } catch(e){ q = null; }
  }
  if(!q) throw new Error("generator failed: " + topic.id);
  q.topic = topic.id;
  q.sec = topic.sec;
  q.tname = topic.name;
  if(q.kind === undefined) q.kind = "num";
  if(q.kind === "num" && q.vals === undefined) q.vals = valsOf(q.ans);
  if(q.kind === "tuple" && q.vals === undefined) q.vals = parseValues(q.ans);
  if(!q.wrongs) q.wrongs = [];
  if(q.kind !== "mc" && q.kind !== "plot"){
    // a "wrong" answer that is actually equivalent to the right one is not a distractor
    q.wrongs = q.wrongs.filter(function(w){
      if(!w || !w.v) return false;
      try { return !checkAnswer(q, w.v).ok; } catch(e){ return false; }
    });
    if(q.wrongs.length) q.mc = mkMC(q.ans, q.wrongs);
  }
  if(q.mc && q.mc.length < 4 && q.kind !== "plot" && q.kind !== "mc"){
    q.mc = q.mc.concat([{ v:"None of these", ok:false,
      why:"The correct answer was one of the other options — work it through again." }]);
  }
  return q;
}
function startSession(cfg){
  const pool = cfg.topicIds
    ? cfg.topicIds.map(function(id){ return BY_ID[id]; }).filter(Boolean)
    : poolFor(cfg.secs || ["2.1","2.2","2.4","2.5"]);
  if(!pool.length) return;
  const picks = pickWeighted(pool, cfg.count, !!cfg.smart);
  S = {
    cfg: cfg,
    qs: picks.map(buildQuestion),
    idx: 0,
    given: [],
    startAt: Date.now(),
    endAt: cfg.minutes ? Date.now() + cfg.minutes*60000 : null,
    revealed: false,
    assisted: false,
    tStart: Date.now()
  };
  render();
  if(S.endAt){
    clearInterval(tickHandle);
    tickHandle = setInterval(tickTimer, 500);
  }
}
function tickTimer(){
  if(!S || !S.endAt){ clearInterval(tickHandle); return; }
  const left = S.endAt - Date.now();
  const box = $("#timer");
  if(box){
    box.textContent = fmtClock(Math.max(0, left));
    box.className = "timer" + (left < 60000 ? " crit" : (left < 300000 ? " warn" : ""));
  }
  if(left <= 0){
    clearInterval(tickHandle);
    finishSession(true);
  }
}
function fmtClock(ms){
  const s = Math.round(ms/1000);
  const m = Math.floor(s/60), r = s % 60;
  return m + ":" + (r < 10 ? "0" : "") + r;
}
function fmtDur(ms){
  const s = Math.round(ms/1000);
  if(s < 60) return s + "s";
  return Math.floor(s/60) + "m " + (s % 60) + "s";
}
function submitAnswer(raw, viaChoice){
  const q = S.qs[S.idx];
  if(S.revealed) return;
  const res = (q.kind === "plot")
    ? { ok: !!(raw && raw.x === q.pt.x && raw.y === q.pt.y) }
    : checkAnswer(q, raw);
  const assisted = S.assisted;
  S.given[S.idx] = {
    raw: (q.kind === "plot" && raw) ? ptT(raw.x, raw.y) : String(raw === undefined || raw === null ? "" : raw),
    ok: res.ok,
    nudge: res.nudge || null,
    assisted: assisted,
    ms: Date.now() - S.tStart,
    viaChoice: !!viaChoice
  };
  const r = rec(q.topic);
  r.a++;
  if(res.ok) r.c++; else r.miss = (r.miss||0) + 1;
  if(assisted) r.asst++;
  if(res.ok && r.miss > 0 && !assisted) r.miss = Math.max(0, r.miss - 0.5);
  store.seen = (store.seen||0) + 1;
  save();
  S.revealed = true;
  render();
}
function nextQuestion(){
  if(S.idx >= S.qs.length - 1){ finishSession(false); return; }
  S.idx++;
  S.revealed = false;
  S.assisted = false;
  S.showMC = false;
  S.hinted = false;
  S.tStart = Date.now();
  render();
}
function finishSession(timedOut){
  clearInterval(tickHandle);
  const total = S.qs.length;
  let right = 0;
  for(let k = 0; k < total; k++){ if(S.given[k] && S.given[k].ok) right++; }
  const entry = {
    at: Date.now(),
    mode: S.cfg.label || S.cfg.mode,
    n: total,
    right: right,
    ms: Date.now() - S.startAt,
    timedOut: !!timedOut
  };
  store.sessions.unshift(entry);
  if(store.sessions.length > 40) store.sessions.pop();
  if(S.cfg.planStep){
    store.plan[S.cfg.planStep] = { done:true, pct: Math.round(right/total*100), at: Date.now() };
  }
  save();
  S.done = true;
  S.result = entry;
  view = "results";
  render();
}

  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());

  if(!store.testAt) return null;

    const d = Math.floor(h/24);

function insertAt(txt){
  const i = $("#ansin");
  if(!i) return;
  const a = i.selectionStart === null ? i.value.length : i.selectionStart;
  const b = i.selectionEnd === null ? i.value.length : i.selectionEnd;

  i.setSelectionRange(at, at);
